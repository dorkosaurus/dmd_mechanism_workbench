// ---- Tile: Isoform × (tissues + variant categories), patient-agnostic ----
// Left half: which isoforms are expressed in which tissues (dots).
// Right half: how many ClinVar Pathogenic + LP variants of each consequence
// class hit each isoform (numbers, nested by first_shared_exon rule).
// Column labels sit at the bottom for both halves.
function laurenTileIsoforms(p) {
  const isos = DATA.isoforms || [];
  const iv   = MECH_DATA?.isoformVariantCounts;
  if (!isos.length) {
    return `<div class="lauren-tile" style="grid-column:span 3">
      <div class="lauren-tile-h">Isoforms × Tissues + Variants</div>
      <div class="lauren-tile-body" style="color:var(--ink-3);font-size:11px">No isoform data.</div>
    </div>`;
  }
  const allTissues = Array.from(new Set(isos.flatMap(i => i.tissues || []))).sort();
  const cats       = iv?.categories || [];
  const nmdCats    = iv?.nmdCategories || [];
  const catLabel   = { nonsense: 'Nonsense', frameshift: 'Frameshift',
                       splice: 'Splice-site', missense: 'Missense',
                       inframe_indel: 'In-frame indel', large_del: 'Large deletion',
                       other: 'Other' };
  const nmdLabel   = { triggering: 'Trigger', escape: 'Escape',
                       transcript_dependent: 'Transcript-dep.' };
  const ivByIso    = Object.fromEntries((iv?.isoforms || []).map(x => [x.id, x]));

  // Map count → cell background intensity (log-scaled) for the variant cells,
  // so the eye picks up the biggest bucket without reading every number.
  const maxCount = Math.max(1, ...(iv?.isoforms || []).flatMap(x =>
    cats.map(c => x.byCategory?.[c] || 0)));
  const bgFor = (n) => {
    if (!n) return 'transparent';
    const t = Math.log(1 + n) / Math.log(1 + maxCount);   // 0..1
    const alpha = 0.08 + t * 0.32;                          // 0.08..0.40
    return `rgba(37, 99, 235, ${alpha.toFixed(2)})`;        // accent-blue
  };

  // Fixed cell widths per section keep dots directly under their bottom labels.
  const TISSUE_COL_W = 22;
  const NUM_COL_W    = 44;
  const rows = isos.map(i => {
    const tissueCells = allTissues.map(t => {
      const carries = (i.tissues || []).includes(t);
      const glyph  = carries ? '●' : '–';
      const color  = carries ? 'var(--accent)' : 'var(--ink-3)';
      return `<td style="padding:4px 0;text-align:center;color:${color};font-size:14px;width:${TISSUE_COL_W}px;min-width:${TISSUE_COL_W}px"
                title="${esc(i.id)} ${carries ? 'is expressed in' : 'is NOT expressed in'} ${esc(t)}">${glyph}</td>`;
    }).join('');
    const isoCounts = ivByIso[i.id];
    const variantCells = cats.map(c => {
      const n = isoCounts?.byCategory?.[c] ?? 0;
      return `<td style="padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;background:${bgFor(n)};color:${n ? 'var(--ink)' : 'var(--ink-3)'};font-weight:${n ? 600 : 400};width:${NUM_COL_W}px;min-width:${NUM_COL_W}px"
                title="${esc(i.id)} × ${esc(catLabel[c] || c)}: ${n} pathogenic variant${n === 1 ? '' : 's'}">${n || '–'}</td>`;
    }).join('');
    const nmdCells = nmdCats.map(n => {
      const cnt = isoCounts?.byNmd?.[n] ?? 0;
      return `<td style="padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;background:${bgFor(cnt)};color:${cnt ? 'var(--ink)' : 'var(--ink-3)'};font-weight:${cnt ? 600 : 400};width:${NUM_COL_W}px;min-width:${NUM_COL_W}px"
                title="${esc(i.id)} × ${esc(nmdLabel[n] || n)}: ${cnt} variant${cnt === 1 ? '' : 's'}">${cnt || '–'}</td>`;
    }).join('');
    // Skinny visual separators between the three halves
    const sep = `<td style="padding:0;width:12px"></td>`;
    return `<tr>
      <td style="padding:4px 8px;font-family:'SF Mono',Menlo,monospace;font-weight:600;white-space:nowrap">${esc(i.id)}</td>
      ${tissueCells}
      ${sep}
      ${variantCells}
      ${sep}
      ${nmdCells}
    </tr>`;
  }).join('');

  // Bottom labels row — each label td matches its data-column width so the
  // vertical text sits exactly centered under its column of dots/numbers.
  // Height reserved for the labels is generous so long strings like
  // "Transcript-dep." at font-size 12 don't bleed off the tile.
  // writing-mode: sideways-rl → text starts at the TOP of the label cell
  // (which sits at the bottom edge of the data rows) and reads DOWNWARD
  // through the cell. Letters stay upright. Wrapping allowed so multi-word
  // tissue names ("skeletal muscle") can flow onto two vertical lines.
  const labelStyleTissue = `padding:8px 2px;font-size:12px;color:var(--ink-2);vertical-align:top;writing-mode:sideways-rl;height:150px;text-align:left;width:${TISSUE_COL_W}px;min-width:${TISSUE_COL_W}px`;
  const labelStyleNum    = `padding:8px 2px;font-size:12px;color:var(--ink-2);vertical-align:top;writing-mode:sideways-rl;height:150px;text-align:left;width:${NUM_COL_W}px;min-width:${NUM_COL_W}px`;

  const prettyTissue = (t) => t.replace(/_/g, ' ');
  const prettyCat    = (s) => (catLabel[s] || s).replace(/_/g, ' ');
  const prettyNmd    = (s) => (nmdLabel[s] || s).replace(/_/g, ' ');
  const labelRow = `<tr>
    <td></td>
    ${allTissues.map(t => `<td style="${labelStyleTissue}">${esc(prettyTissue(t))}</td>`).join('')}
    <td></td>
    ${cats.map(c => `<td style="${labelStyleNum}">${esc(prettyCat(c))}</td>`).join('')}
    <td></td>
    ${nmdCats.map(n => `<td style="${labelStyleNum}">${esc(prettyNmd(n))}</td>`).join('')}
  </tr>`;

  // Section-header row (inside the same table so cells align with actual columns)
  const hdrStyle = 'text-align:center;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;padding:4px 0 6px;border-bottom:1px solid var(--line-2)';
  const headerRow = `<tr>
    <td></td>
    <td colspan="${allTissues.length}" style="${hdrStyle}">Isoform × Tissue</td>
    <td></td>
    <td colspan="${cats.length}"       style="${hdrStyle}">Isoform × Pathogenic variant</td>
    <td></td>
    <td colspan="${nmdCats.length}"    style="${hdrStyle}">Isoform × NMD Prediction</td>
  </tr>`;

  return `<div class="lauren-tile" style="grid-column:span 3">
    <div class="lauren-tile-h">Isoforms</div>
    <div style="overflow-x:auto">
      <table style="border-collapse:collapse;font-size:12px">
        <tbody>
          ${headerRow}
          ${rows}
          ${labelRow}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ---- Tile 1: Genetic Variants ----
function laurenTileGeneticVariants(p) {
  const cc = MECH_DATA?.clinvarComposition;
  const patients = DATA.patients || [];
  const v = p.variant || {};
  // Map ClinVar classifier labels → readable + workbench consequence names.
  const LABEL = { nonsense: 'Nonsense', frameshift: 'Frameshift', splice: 'Splice-site',
                  missense: 'Missense', inframe_indel: 'In-frame indel',
                  large_del: 'Large deletion', other: 'Other' };
  const COL   = { Nonsense: '#7a5cd6', Frameshift: '#c94a4a', 'Splice-site': '#d78a2b',
                  Missense: '#4d96d1', 'In-frame indel': '#0d9488',
                  'Large deletion': '#64748b', Other: '#94a3b8' };

  if (!cc || !cc.breakdown?.length) {
    // Fallback: cohort-only view (ClinVar bake didn't run)
    return `<div class="lauren-tile">
      <div class="lauren-tile-h">Genetic Variants</div>
      <div class="lauren-tile-body" style="color:var(--ink-3);font-size:11px">
        clinvarComposition missing — re-run <code>hydrate_mechanism_view</code>.
      </div>
    </div>`;
  }

  const meC = v.consequence || '';
  // Normalize the patient's own consequence into the same label vocabulary
  const meNorm = /frame/i.test(meC) ? 'Frameshift'
               : /nonsense/i.test(meC) ? 'Nonsense'
               : /splice/i.test(meC) ? 'Splice-site'
               : /missense/i.test(meC) ? 'Missense'
               : meC;
  const max = cc.breakdown[0]?.n || 1;
  const rows = cc.breakdown.slice(0, 6).map(row => {
    const lbl = LABEL[row.label] || row.label;
    const w = (row.n / max) * 100;
    const isMe = lbl === meNorm;
    return `<div class="lauren-mini-bar ${isMe ? 'me' : ''}">
      <span class="lb-lbl">${esc(lbl)}</span>
      <span class="lb-bar"><span class="lb-bar-fill" style="width:${w.toFixed(0)}%;background:${COL[lbl] || 'var(--accent)'}"></span></span>
      <span class="lb-val">${row.n}</span>
    </div>`;
  }).join('');

  return `<div class="lauren-tile">
    <div class="lauren-tile-h">Genetic Variants</div>
    <div>
      <span class="lauren-tile-big ok">${cc.total.toLocaleString()}</span>
      <div class="lauren-tile-sub">pathogenic + likely pathogenic · ClinVar</div>
    </div>
    <div class="lauren-tile-body">${rows}</div>
    <div style="border-top:1px dashed var(--line-2);margin-top:8px;padding-top:6px;font-size:10px;color:var(--ink-3);line-height:1.4">
      <b style="color:var(--accent)">${esc(patientLabel(p))}:</b> <code style="font-size:10px">${esc(v.nucleotide || '?')}</code> · ${esc(v.consequence || '?')} · exon ${esc(v.exon || '?')} · ACMG ${esc(v.acmg || '?')}<br>
      <span style="color:var(--ink-3)">workbench cohort: ${patients.length} curated (Zhang 2024)</span>
    </div>
  </div>`;
}

// ---- Tile 2: NMD Prediction ----
function laurenTileNMD(p) {
  const nmd = MECH_DATA?.nmdCohort;
  const path = nmd?.grid?.pathogenic;
  if (!path) {
    return `<div class="lauren-tile">
      <div class="lauren-tile-h">NMD Prediction</div>
      <div class="lauren-tile-body" style="color:var(--ink-3);font-size:11px">
        nmdCohort missing — re-run <code>hydrate_mechanism_view</code>.
      </div>
    </div>`;
  }
  const trigger = path.triggering || 0;
  const escape  = path.escape || 0;
  const tdep    = path.transcript_dependent || 0;
  const total   = trigger + escape + tdep;

  // Verdict for this patient — mirrors classify_variant_nmd upstream.
  const c = (p.variant?.consequence || '').toLowerCase();
  const exonN = p.variant?.exonNum;
  const nExons = DATA.gene?.nExons || 79;
  const meBucket = /frameshift|nonsense/.test(c)
                     ? (exonN != null && exonN >= nExons - 1 ? 'escape' : 'triggering')
                 : /splice/.test(c)   ? 'triggering'
                 : /missense|inframe/.test(c) ? 'transcript_dependent'
                 : 'transcript_dependent';
  const VERDICT = {
    triggering: ['Predicted trigger',       'var(--bad)'],
    escape:     ['Predicted escape',        'var(--warn)'],
    transcript_dependent: ['Transcript-dep.', 'var(--good)'],
  };
  const [meLabel, meColor] = VERDICT[meBucket];

  // Pie chart via SVG arc paths. Slices in a fixed order so colors stay
  // legible. Highlight this patient's slice with a slight radial pop.
  const cx = 40, cy = 40, R = 36;
  const slices = [
    { key: 'triggering',           frac: trigger / total, color: 'var(--bad)' },
    { key: 'escape',               frac: escape  / total, color: 'var(--warn)' },
    { key: 'transcript_dependent', frac: tdep    / total, color: 'var(--good)' },
  ];
  const pieSlices = (() => {
    let a0 = -Math.PI / 2;  // start at 12 o'clock
    const out = [];
    for (const s of slices) {
      if (s.frac <= 0) continue;
      const a1 = a0 + s.frac * 2 * Math.PI;
      const isMe = s.key === meBucket;
      // Slight radial pop for the "me" slice
      const dx = isMe ? Math.cos((a0 + a1) / 2) * 3 : 0;
      const dy = isMe ? Math.sin((a0 + a1) / 2) * 3 : 0;
      const x1 = cx + dx + R * Math.cos(a0);
      const y1 = cy + dy + R * Math.sin(a0);
      const x2 = cx + dx + R * Math.cos(a1);
      const y2 = cy + dy + R * Math.sin(a1);
      const large = s.frac > 0.5 ? 1 : 0;
      // Handle full-circle edge case (single slice) with two half arcs
      let d;
      if (s.frac >= 0.999) {
        d = `M ${cx+dx-R},${cy+dy} A ${R} ${R} 0 1 1 ${cx+dx+R},${cy+dy} A ${R} ${R} 0 1 1 ${cx+dx-R},${cy+dy} Z`;
      } else {
        d = `M ${cx+dx},${cy+dy} L ${x1.toFixed(2)},${y1.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
      }
      const stroke = isMe ? 'white' : 'var(--panel)';
      const sw     = isMe ? 2 : 1;
      out.push(`<path d="${d}" fill="${s.color}" stroke="${stroke}" stroke-width="${sw}"><title>${esc(s.key)}: ${(s.frac*100).toFixed(1)}%${isMe ? ' — this patient' : ''}</title></path>`);
      a0 = a1;
    }
    return out.join('');
  })();
  const donut = pieSlices;

  const pct = (n) => total ? ((n / total) * 100).toFixed(0) + '%' : '0%';

  return `<div class="lauren-tile">
    <div class="lauren-tile-h">Nonsense Mediated Decay (NMD)</div>
    <div>
      <span class="lauren-tile-big bad">${trigger.toLocaleString()}</span>
      <div class="lauren-tile-sub">predicted NMD-triggering of ${total.toLocaleString()} pathogenic (ClinVar)</div>
    </div>
    <div class="lauren-tile-body">
      <div class="lauren-donut">
        <svg width="90" height="90" viewBox="-4 -4 88 88">
          ${donut}
        </svg>
        <div class="lauren-donut-legend">
          <div><span style="color:var(--bad)">●</span> Predicted trigger · ${trigger.toLocaleString()} (${pct(trigger)})</div>
          <div><span style="color:var(--warn)">●</span> Predicted escape · ${escape.toLocaleString()} (${pct(escape)})</div>
          <div><span style="color:var(--good)">●</span> Transcript-dependent · ${tdep.toLocaleString()} (${pct(tdep)})</div>
        </div>
      </div>
    </div>
    <div style="border-top:1px dashed var(--line-2);margin-top:8px;padding-top:6px;font-size:10px;color:var(--ink-3);line-height:1.4">
      <b style="color:${meColor}">${esc(patientLabel(p))}: ${esc(meLabel)}</b>
      <span style="color:var(--ink-3)"> · ${esc(p.variant?.consequence || '?')} at exon ${esc(p.variant?.exon || '?')}</span>
    </div>
  </div>`;
}

// ---- Tile 3: Protein Impact — healthy vs consensus NMD-escape truncation ----
function laurenTileProteinImpact(p) {
  // CT is kept gray (neutral) so the truncation visibly stands out on it.
  const DOMAINS = [
    { name: 'N-term actin-binding',       short: 'N-ABD', start: 1,    end: 240,  color: '#4d96d1' },
    { name: 'Central rod (24 spectrin repeats, 4 hinges)', short: 'Rod', start: 241,  end: 3040, color: '#7a5cd6' },
    { name: 'Cysteine-rich (DGC anchor)', short: 'CR',    start: 3080, end: 3360, color: '#d78a2b' },
    { name: 'C-terminal (syntrophin-binding)', short: 'CT', start: 3361, end: 3685, color: '#9ca3af' },
  ];
  const LEN = 3685;
  const ev = MECH_DATA?.nmdCohort?.escapeVariants || [];
  const meResidue = DATA.proteinImpactCohort?.[p.id]?.residue;
  const meImpact  = DATA.proteinImpactCohort?.[p.id]?.impactScore;
  const meNmdEscape = meResidue != null && meResidue >= 3600;

  if (!ev.length) {
    return `<div class="lauren-tile">
      <div class="lauren-tile-h">Protein Impact</div>
      <div class="lauren-tile-body" style="color:var(--ink-3);font-size:11px">
        No NMD-escape variants in ClinVar corpus — nothing to render.
      </div>
    </div>`;
  }
  // Consensus truncation = median of the 4 escape variants' residue positions.
  const residues = ev.map(v => v.residue).sort((a, b) => a - b);
  const consensus = Math.round(residues[Math.floor(residues.length / 2)]);
  const lostAA = LEN - consensus;

  const cutDom = DOMAINS.find(d => consensus >= d.start && consensus <= d.end);
  const fullyLost = DOMAINS.filter(d => d.start > consensus);

  // Combined SVG so the truncation cut-line can span BOTH bars vertically.
  // Same horizontal scale for both bars: aa 1..LEN → x=0..W.
  const W = 280, H = 18, GAP = 22, LABEL_H = 14, AA_LABEL_W = 60;
  const totalH = 2 * H + GAP + 2 * LABEL_H + 12;
  const scale  = r => (r - 1) / (LEN - 1) * W;
  const TRUNC_OUTLINE = '#9ca3af';

  const domainSegs = (yTop, truncatedAt) => {
    const stop = truncatedAt || LEN;
    return DOMAINS.filter(d => d.start <= stop).map(d => {
      const x1 = scale(d.start);
      const x2 = scale(Math.min(d.end, stop));
      const w  = Math.max(0.5, x2 - x1);
      return `<rect x="${x1.toFixed(1)}" y="${yTop}" width="${w.toFixed(1)}" height="${H}"
                fill="${d.color}" stroke="white" stroke-width="0.6">
                <title>${esc(d.name)} (aa ${d.start}-${d.end})</title>
              </rect>`;
    }).join('');
  };
  // For the truncated bar: draw the white-with-outline "phantom" region
  // showing where the truncated aa WOULD be (from cut to LEN).
  const truncatedPhantom = (yTop, truncatedAt) => {
    const x1 = scale(truncatedAt);
    const x2 = scale(LEN);
    const w  = Math.max(0.5, x2 - x1);
    return `<rect x="${x1.toFixed(1)}" y="${yTop}" width="${w.toFixed(1)}" height="${H}"
              fill="white" stroke="${TRUNC_OUTLINE}" stroke-width="1" stroke-dasharray="3 2">
              <title>Truncated (aa ${truncatedAt + 1}-${LEN})</title>
            </rect>`;
  };

  // Vertical cut-line spanning both bars
  const cutX  = scale(consensus);
  const healthyY = LABEL_H;
  const truncY   = LABEL_H + H + GAP + LABEL_H;
  const cutLine = `<line x1="${cutX.toFixed(1)}" y1="${healthyY - 4}" x2="${cutX.toFixed(1)}" y2="${truncY + H + 4}"
                     stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3 3"/>
                   <text x="${cutX.toFixed(1)}" y="${healthyY - 6}" text-anchor="middle"
                     fill="var(--bad)" font-size="9" font-weight="700">truncation @ aa ${consensus}</text>`;

  // AA-count labels on right side (positioned OUTSIDE the bar viewport)
  const healthyCount = `<text x="${W + 6}" y="${healthyY + H / 2 + 3}" fill="var(--ink)"
                          font-size="10" font-weight="700" font-variant-numeric="tabular-nums">${LEN} aa</text>`;
  const truncCount   = `<text x="${W + 6}" y="${truncY + H / 2 + 3}" fill="var(--ink)"
                          font-size="10" font-weight="700" font-variant-numeric="tabular-nums">${consensus} aa</text>`;

  // Patient / escape-variant markers
  const meMarker = meResidue && meResidue <= LEN
    ? `<circle cx="${scale(meResidue).toFixed(1)}" cy="${healthyY + H + 5}" r="2" fill="var(--accent)"><title>${esc(patientLabel(p))} variant @ aa ${meResidue}</title></circle>` : '';
  const escapeMks = ev.map(v =>
    `<circle cx="${scale(v.residue).toFixed(1)}" cy="${truncY + H + 5}" r="1.6" fill="var(--bad)"><title>${esc(v.variantName)}</title></circle>`
  ).join('');

  // Bar labels
  const healthyLabel = `<text x="0" y="${healthyY - 4}" fill="var(--ink-2)" font-size="10" font-weight="600">Healthy dystrophin</text>`;
  const truncLabel   = `<text x="0" y="${truncY - 4}" fill="var(--ink-2)" font-size="10" font-weight="600">Truncation · consensus of ${ev.length} NMD-escape variants</text>`;

  const svg = `<svg width="100%" viewBox="-2 0 ${W + AA_LABEL_W} ${totalH}"
                   style="display:block;max-width:${W + AA_LABEL_W + 4}px" preserveAspectRatio="xMinYMid meet">
    ${healthyLabel}
    ${domainSegs(healthyY, null)}
    ${truncLabel}
    ${domainSegs(truncY, consensus)}
    ${truncatedPhantom(truncY, consensus)}
    ${cutLine}
    ${healthyCount}
    ${truncCount}
    ${meMarker}
    ${escapeMks}
  </svg>`;

  // Key — colored domains + truncated phantom + cut marker
  const domainKey = DOMAINS.map(d => `
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-2);margin-right:10px;white-space:nowrap">
      <span style="display:inline-block;width:10px;height:9px;background:${d.color};border-radius:1px"></span>
      ${esc(d.short)}
    </span>`).join('');
  const key = `${domainKey}
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-2);margin-right:10px">
      <span style="display:inline-block;width:10px;height:9px;background:white;border:1px dashed ${TRUNC_OUTLINE};border-radius:1px"></span>
      truncated
    </span>
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--bad)">
      <span style="display:inline-block;width:2px;height:10px;background:var(--bad)"></span>
      cut
    </span>`;

  const lostSummary = fullyLost.length
    ? `${fullyLost.length} full domain${fullyLost.length === 1 ? '' : 's'} (${fullyLost.map(d => d.short).join(', ')})`
    : `partial ${cutDom?.short || 'C-term'} (${lostAA} aa)`;

  const patientCallout = meNmdEscape && meResidue
    ? `<b style="color:var(--accent)">${esc(patientLabel(p))}</b> is itself an NMD-escape variant @ aa ${meResidue}`
    : `<b style="color:var(--ink-2)">${esc(patientLabel(p))}</b> triggers NMD → no protein made (bar shows escape consensus, not this patient)`;

  return `<div class="lauren-tile">
    <div class="lauren-tile-h">Protein Impact</div>
    ${svg}
    <div style="margin-top:6px;font-size:11px;color:var(--ink-2);line-height:1.5">
      <b style="color:var(--bad)">Lost C-terminal domain:</b> ${lostSummary}
    </div>
    <div style="margin-top:4px">${key}</div>
    <div style="border-top:1px dashed var(--line-2);margin-top:6px;padding-top:6px;font-size:10px;color:var(--ink-3);line-height:1.4">
      ${patientCallout}${meImpact != null ? ` · ESM3 impact ${meImpact.toFixed(2)}` : ''}
    </div>
  </div>`;
}

// ---- Tile 4: Most Affected Cell Type ----
// ---- Tile: Most Affected Cell Types (ranked by DGC-completeness) ----
// Patient-agnostic. Cells ranked by how many DGC members (DMD + 13
// partners) are co-expressed there. The higher the completeness, the
// more the DGC is actually being assembled in that cell — so DMD loss
// has more mechanism to disrupt.
function laurenTileMostAffectedCells(p) {
  const cr = MECH_DATA?.celltypeRanking;
  if (!cr || !cr.cellTypes?.length) {
    return `<div class="lauren-tile">

  return `<div class="lauren-tile">
    <div class="lauren-tile-h">Most Affected Cell Types</div>

// ---- Sidebar: Top Pathways (ranked by DMD-interactor coverage density) ----
function laurenTileTopPathways(p) {

// ---- Bottom: Mechanistic Hypotheses table ----
function laurenHypothesesTable(p) {
  const meta = Object.fromEntries((MECH_DATA?.hypotheses || []).map(h => [h.id, h]));
  const ranked = [...(p.hypothesisRanking || [])].sort((a, b) => (a.rank || 99) - (b.rank || 99));
  if (!ranked.length) return `<div class="lauren-hyp-table" style="color:var(--ink-3)">No hypotheses for this patient.</div>`;
  const axisBar = (v, color) => {
    const w = Math.max(0, Math.min(100, (v || 0) * 100));
    return `<div class="lauren-axis-bar">
      <span class="lb-bar"><span class="lb-bar-fill" style="display:block;height:100%;width:${w.toFixed(0)}%;background:${color}"></span></span>
      <span class="lb-val">${(v || 0).toFixed(2)}</span>
    </div>`;
  };
  const header = `<div class="lauren-hyp-row head">
    <span>#</span>
    <span>Hypothesis</span>
    <span>Confidence</span>
    <span>Severity</span>
    <span>Treatability</span>
    <span>Top therapy</span>
  </div>`;
  const rows = ranked.map(h => {
    const m = meta[h.id] || {};
    const sv = h.scoreVector || {};
    const therapy = (h.therapeutics || [])[0];
    const therapyStr = therapy
      ? `<b>${esc(therapy.modality)}</b><br><span style="color:var(--ink-3);font-size:10px">${esc(therapy.design?.transgene || therapy.design?.agent || therapy.design?.target_exon || therapy.eligibilityStatus || '')}</span>`
      : '<span style="color:var(--ink-3)">—</span>';
    const idCls = h.rank === 1 ? 'lauren-hyp-id top' : 'lauren-hyp-id';
    const topPrem = [...(h.premises || [])]
      .filter(x => x.sourceId !== 'zhang_2024')
      .sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight))[0];
    const supStr = topPrem
      ? `${esc(topPrem.sourceId)} · <span style="color:${topPrem.weight > 0 ? 'var(--good)' : 'var(--bad)'}">${topPrem.weight >= 0 ? '+' : ''}${topPrem.weight.toFixed(2)}</span>`
      : '';
    return `<div class="lauren-hyp-row">
      <span class="${idCls}">H${esc(h.id)}</span>
      <div>
        <div class="lauren-hyp-name">${esc(m.name || `Hypothesis ${h.id}`)}</div>
        <div class="lauren-hyp-sub">score ${(h.score || 0).toFixed(1)}/10 · top premise: ${supStr}</div>
      </div>
      ${axisBar(sv.confidence, 'var(--accent)')}
      ${axisBar(sv.severity, 'var(--bad)')}
      ${axisBar(sv.treatability, 'var(--good)')}
      <div style="font-size:11px">${therapyStr}</div>
    </div>`;
  }).join('');
  return `<div class="lauren-hyp-table">${header}${rows}</div>`;
}

function renderDataStreamEntry(entry, idx, p) {
  if (entry.type === 'user') {
    return `<div class="pc-data-msg user">
      <div class="pc-data-msg-role">you</div>${esc(entry.text)}
    </div>`;
  }
  if (entry.type === 'agent') {
    return `<div class="pc-data-msg agent">
      <div class="pc-data-msg-role">agent</div>${esc(entry.text)}
    </div>`;
  }
  if (entry.type === 'group') {
    const n = entry.artifacts.length;
    const gridCls = n === 1 ? 'n1' : n === 2 ? 'n2' : 'n3plus';
    const label = entry.artifacts.length === 1
      ? DATA_CHIPS.flatMap(s => s.items).find(c => c.qid === entry.artifacts[0].qid)?.label || entry.artifacts[0].qid
      : `${n} artifacts fired together`;
    const filterSummary = entry.artifacts
      .map(a => Object.keys(a.filter || {}).length ? `${a.qid}[${Object.entries(a.filter).map(([k,v]) => `${k}=${v}`).join(',')}]` : a.qid)
      .join(' + ');
    const bodies = entry.artifacts.map(a => renderDataArtifact(a, -1, p, {inGroup: true})).join('');
    return `<div class="pc-data-group">
      <div class="pc-data-group-h">
        <span>${esc(filterSummary)}</span>
        <button class="close" data-stream-remove="${idx}" title="Remove this group">×</button>
      </div>
      <div class="pc-data-group-grid ${gridCls}">${bodies}</div>
    </div>`;
  }
  if (entry.type === 'artifact') {
    return renderDataArtifact(entry, idx, p);
  }
  return '';
}

function wireDataView(p) {
  document.querySelectorAll('[data-pillar-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.pillarToggle;
      if (dataExpandedPillars.has(key)) dataExpandedPillars.delete(key);
      else dataExpandedPillars.add(key);
      renderPage();
    });
  });

  // Chip click → route through the chat backend as a natural-language turn.
  // Uses the chip's label as the query so the transcript reads like the
  // user asked it. Falls back to a local direct-render if the backend is
  // unreachable, so the workbench is still usable without ANTHROPIC_API_KEY.
  document.querySelectorAll('[data-chip-qid]').forEach(btn => {
    btn.addEventListener('click', () => {
      const label = btn.dataset.chipLabel || btn.dataset.chipQid;
      sendChatTurn(p, label);
    });
  });

  document.querySelectorAll('[data-stream-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.streamRemove, 10);
      dataStream.splice(idx, 1);
      renderPage();
    });
  });

  // Q5 synthesis / route_to_mech → jump to Mechanism tab
  document.querySelectorAll('[data-jump-mechanism]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = 'mechanism';
      renderPage();
    });
  });

  // Lollipop marker click → open variant detail modal. Delegated because
  // markers are re-rendered on every renderPage.
  const stream = document.getElementById('data-stream');
  if (stream) stream.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-variant-id]');
    if (!el) return;
    variantModalId = el.dataset.variantId;
    renderPage();
  });

  // Chat form: submit → POST /chat
  const form = document.getElementById('data-chat-form');
  if (form) form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const input = document.getElementById('data-chat-input');
    const q = (input?.value || '').trim();
    if (!q || dataChatBusy) return;
    if (input) input.value = '';
    sendChatTurn(p, q);
  });
  const reset = document.getElementById('data-chat-reset');
  if (reset) reset.addEventListener('click', () => {
    dataStream = [];
    dataConversation = [];
    dataChatStatus = '';
    renderPage();
  });
}

// Send one turn to the chat backend. Prepends the user message immediately,
// then the agent's response (text + composed artifact group) when it lands.
async function sendChatTurn(p, userText) {
  if (dataChatBusy) return;
  dataChatBusy = true;
  dataChatStatus = 'thinking…';
  dataStream.unshift({ type: 'user', text: userText });
  dataConversation.push({ role: 'user', content: userText });
  renderPage();

  // Compact patient blob for the backend — just what the system prompt uses.
  const patientBlob = {
    id: p.id,
    phenotype: p.phenotype,
    variant: p.variant,
  };

  try {
    const r = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: dataConversation, patient: patientBlob }),
    });
    if (!r.ok) {
      const errBody = await r.text();
      throw new Error(`HTTP ${r.status}: ${errBody.slice(0, 200)}`);
    }
    const resp = await r.json();
    if (resp.error) throw new Error(resp.error);

    if (resp.text) {
      dataStream.unshift({ type: 'agent', text: resp.text });
      dataConversation.push({ role: 'assistant', content: resp.text });
    }
    if (resp.artifacts && resp.artifacts.length) {
      dataStream.unshift({
        type: 'group',
        artifacts: resp.artifacts.map(a => ({ ...a, id: Date.now() + Math.random() })),
      });
    }
    dataChatStatus = resp.usage
      ? `${ANTHROPIC_MODEL_SHORT(resp.model)} · in ${resp.usage.input_tokens}t · out ${resp.usage.output_tokens}t · ${resp.artifacts?.length || 0} chart(s)`
      : `${resp.artifacts?.length || 0} chart(s) composed`;
  } catch (err) {
    dataChatStatus = `error · ${err.message || err}`;
    dataStream.unshift({
      type: 'agent',
      text: `Chat backend unreachable (${err.message || err}). Start it with:  ANTHROPIC_API_KEY=… ~/venv/bin/python -m prototype.workbench.chat_server`,
    });
  } finally {
    dataChatBusy = false;
    renderPage();
    requestAnimationFrame(() => {
      const stream = document.getElementById('data-stream');
      if (stream) stream.scrollTop = 0;
    });
  }
}

function ANTHROPIC_MODEL_SHORT(m) {
  return (m || '').replace(/-\d{8}$/, '').replace(/^claude-/, '');
}

function renderDataArtifact(a, idx, p, opts) {
  const chip = DATA_CHIPS.flatMap(s => s.items).find(c => c.qid === a.qid);
  const label = chip?.label || a.qid;
  const isRoadmap = chip?.status === 'roadmap';

  const badgeText = isRoadmap ? 'roadmap' : 'chart';
  const inGroup = opts && opts.inGroup;
  const closeBtn = inGroup ? '' :
    `<button class="close" data-stream-remove="${idx}">×</button>`;
  const filterStr = a.filter && Object.keys(a.filter).length
    ? ' · ' + Object.entries(a.filter).map(([k, v]) => `${k}=${v}`).join(' · ')

// Small helper: horizontal bar row. `max` normalizes width; `hint` prints
// after the value. Uses accent color unless overridden.
function dataBarRow(label, val, max, opts) {
  const o = opts || {};
  const w = max > 0 ? Math.max(0, Math.min(100, (val / max) * 100)) : 0;
  const color = o.color || 'var(--accent)';
  const hint  = o.hint || '';
  const fmt   = o.fmt || (v => (typeof v === 'number' ? v.toFixed(2) : String(v)));
  return `<div style="display:grid;grid-template-columns:180px 1fr 90px;gap:8px;align-items:center;font-size:11px;margin-bottom:3px">
    <span style="color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(label)}">${esc(label)}</span>
    <span style="background:var(--tile);height:10px;border-radius:2px;position:relative;overflow:hidden">
      <span style="position:absolute;left:0;top:0;bottom:0;width:${w.toFixed(1)}%;background:${color}"></span>
    </span>
    <span style="color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums">${esc(fmt(val))}${hint ? ' ' + esc(hint) : ''}</span>
  </div>`;
}

// Pull the highest-|weight| premise of a given sourceId across the top-3
// hypotheses for this patient — every source is chain-attributed but the
// blob content is the same regardless of which hypothesis it fired on.
function dataPatientPremise(p, sourceId) {
  for (const h of (p.hypothesisRanking || [])) {
    for (const pr of (h.premises || [])) {
      if (pr.sourceId === sourceId) return pr;
    }
  }
  return null;
}

// Dispatch. All renderers return HTML fragments. Real ones read from
// the patient blob + MECH_DATA; roadmap ones return a describes-what-
// would-appear stub (per JARVIS "honest stubs" convention).
function renderDataArtifactBody(a, p) {
  switch (a.renderer) {
    // ---------------- LA.1 — labs summary (patient) ----------------
    case 'labs_summary': {
      const labs = p.labs || [];
      if (!labs.length) return `<div class="pc-data-roadmap-body">No labs for this patient.</div>`;
      const f = a.filter || {};
      const layerF = (f.layer || '').toLowerCase();
      const flagF  = (f.flag  || '').toLowerCase();
      const abn = labs
        .filter(l => l.flag !== 'normal')
        .filter(l => !layerF || (l.layer || '').toLowerCase() === layerF)
        .filter(l => !flagF  || (l.flag  || '').toLowerCase() === flagF);
      const byLayer = {};
      for (const l of abn) (byLayer[l.layer || 'other'] ||= []).push(l);
      const layerRows = Object.entries(byLayer).map(([layer, ls]) => {
        const rows = ls.map(l => {
          const fold = (l.flag === 'high' && l.refHigh) ? `${(l.value / l.refHigh).toFixed(1)}× ULN`
                     : (l.flag === 'low' && l.refLow)   ? `${(l.refLow / l.value).toFixed(1)}× < LLN` : '';
          const color = l.flag === 'high' ? 'var(--bad)' : l.flag === 'low' ? 'var(--warn)' : 'var(--ink-2)';
          return `<tr>
            <td style="padding:4px 6px;font-weight:600">${esc(l.label)}</td>
            <td style="padding:4px 6px;font-variant-numeric:tabular-nums">${esc(l.value)} ${esc(l.unit || '')}</td>
            <td style="padding:4px 6px;color:${color};font-weight:600">${esc(l.flag)}</td>
            <td style="padding:4px 6px;color:var(--ink-3);font-size:11px">${esc(fold)}</td>
            <td style="padding:4px 6px;color:var(--ink-3);font-size:11px">${esc(l.tissue || '')}</td>
          </tr>`;
        }).join('');
        return `<div style="margin-bottom:10px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);font-weight:700;margin-bottom:4px">${esc(layer)}</div>
          <table style="width:100%;border-collapse:collapse;font-size:12px">${rows}</table>
        </div>`;
      }).join('');
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        <b>${abn.length}</b> abnormal of <b>${labs.length}</b> synthetic labs. Grouped by biological-organization layer the lab probes.
      </div>${layerRows || '<div class="pc-data-roadmap-body">All labs within reference range.</div>'}`;
    }

    // ---------------- VA.3 — variant composition (dashboard tile) ----------------
    case 'variant_composition': {
      const groupBy = ((a.filter?.group_by) || 'consequence').toLowerCase();
      const patients = DATA.patients || [];
      const total = patients.length;
      const meVal = groupBy === 'acmg'
        ? (p.variant?.acmg || '?')
        : (p.variant?.consequence || '?');
      const counts = {};
      for (const x of patients) {
        const k = groupBy === 'acmg'
          ? (x.variant?.acmg || 'unknown')
          : (x.variant?.consequence || 'unknown');
        counts[k] = (counts[k] || 0) + 1;
      }
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const max = entries[0]?.[1] || 1;
      const COL = { 'Frameshift': '#c94a4a', 'Nonsense': '#7a5cd6',
                    'Splice-site': '#d78a2b', 'Missense': '#4d96d1',
                    'P': '#c94a4a', 'LP': '#d78a2b', 'VUS': '#8895a7' };
      const rows = entries.map(([k, n]) => {
        const pct = ((n / total) * 100).toFixed(0);
        const isMine = k === meVal;
        const color = COL[k] || 'var(--accent)';
        return `<div style="display:grid;grid-template-columns:130px 1fr 60px;gap:8px;align-items:center;font-size:12px;margin-bottom:5px${isMine ? ';background:var(--accent-soft);padding:2px 4px;border-radius:3px' : ''}">
          <span style="color:var(--ink);font-weight:${isMine ? '700' : '500'}">${esc(k)}${isMine ? ' <span style=\"color:var(--accent);font-size:10px\">← this patient</span>' : ''}</span>
          <span style="background:var(--tile);height:12px;border-radius:2px;position:relative;overflow:hidden">
            <span style="position:absolute;left:0;top:0;bottom:0;width:${((n / max) * 100).toFixed(1)}%;background:${color}"></span>
          </span>
          <span style="color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${n} <span style="color:var(--ink-3);font-weight:400">(${pct}%)</span></span>
        </div>`;
      }).join('');
      const alt = groupBy === 'acmg' ? 'consequence' : 'acmg';
      return `<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px">
        <div style="font-size:36px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums">${total}</div>
        <div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:700">pathogenic variants<br><span style="text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:500">Zhang cohort · curated for workbench</span></div>
      </div>
      <div style="font-size:10px;text-transform:uppercase;color:var(--ink-3);font-weight:700;letter-spacing:0.06em;margin-bottom:6px">by ${esc(groupBy)}</div>
      ${rows}
      <div style="margin-top:10px;color:var(--ink-3);font-size:11px">
        Full pathogenic-variant corpus (LOVD, ClinVar) is a roadmap bake. Try <code>group_by=${alt}</code> to regroup.
      </div>`;
    }

    // ---------------- VA.2 — variant lollipop (genotype × phenotype) ----------------
    case 'variant_lollipop': {
      const widget = window.WIDGETS?.variantLollipop;
      if (!widget) return `<div class="pc-data-roadmap-body">Widget <code>variantLollipop</code> not loaded.</div>`;

      const PHEN_ROW = { 'DMD': 0, 'Duchenne': 0, 'BMD': 1, 'Becker': 1,
                         'IMD': 2, 'intermediate': 2, 'DCM': 3, 'Cardiac': 3,
                         'Cognitive': 4, 'CNS': 4 };
      const COL_ACCENT = '#0a84ff';   // this patient
      const COL_COHORT = '#2c3e50';   // other Zhang patients

      // Start from the widget's illustrative distribution (documented as a
      // stub — but it encodes the known DMD hotspot geography correctly).
      const example = widget.example;
      const cohortVariants = [];
      for (const x of (DATA.patients || [])) {
        const v = x.variant || {};
        const exonN = v.exonNum ?? parseInt(v.exon, 10);
        if (!Number.isFinite(exonN)) continue;
        const rowKey = Object.keys(PHEN_ROW).find(k => (x.phenotype || '').includes(k));
        const y = rowKey == null ? 0 : PHEN_ROW[rowKey];
        const isMe = x.id === p.id;
        cohortVariants.push({
          id: x.id,                             // makes the marker clickable
          x: exonN, y,
          r: isMe ? 8 : 5,
          color: isMe ? COL_ACCENT : COL_COHORT,
          label: `${x.id}${isMe ? ' (this patient)' : ''} · exon ${exonN} · ${v.consequence || '?'} · ${v.acmg || '?'} · ${x.phenotype || '?'} · click for details`,
        });
      }

      // Optional phenotype-row filter
      const pf = (a.filter?.phenotype || '').toLowerCase();
      let cats = example.yCategories;
      let bgVariants = example.variants;
      let filteredCohort = cohortVariants;
      if (pf) {
        const rowIdx = cats.findIndex(c => c.toLowerCase().includes(pf));
        if (rowIdx >= 0) {
          cats = [cats[rowIdx]];
          bgVariants   = example.variants.filter(v => v.y === rowIdx).map(v => ({ ...v, y: 0 }));
          filteredCohort = cohortVariants.filter(v => v.y === rowIdx).map(v => ({ ...v, y: 0 }));
        }
      }

      const props = {
        ...example,
        yCategories: cats,
        variants: [...bgVariants, ...filteredCohort],   // cohort on top
        colorLegend: [
          { label: 'This patient',         color: COL_ACCENT },
          { label: 'Other Zhang patients', color: COL_COHORT },
          ...example.colorLegend,
        ],
        footer: `Background lollipops (colored by phenotype) are illustrative — encode the known DMD hotspot geography (exon 44-55 belt, proximal DCM, distal Dp140/Dp71). Foreground <b style="color:${COL_ACCENT}">blue</b> = ${patientLabel(p)}'s variant, <b style="color:${COL_COHORT}">dark</b> = other Zhang cohort patients (n=${cohortVariants.length - 1}). Real ClinVar/LOVD projection is a roadmap bake.`,
      };
      return widget.render(props);
    }

    // ---------------- VA.1 — variant details card ----------------
    case 'variant_card': {
      const v = p.variant || {};
      const rows = [
        ['Cohort ID',      p.cohortPatientId || p.id],
        ['Exon',           v.exon ?? '?'],
        ['Nucleotide (HGVSc)', v.nucleotide ?? '?'],
        ['AA change (HGVSp)',  v.aaChange ?? '?'],
        ['Consequence',    v.consequence ?? '?'],
        ['ACMG',           v.acmg ?? '?'],
        ['Phenotype',      p.phenotype ?? '?'],
        ['Age',            p.age != null ? `${p.age} y` : '?'],
        ['Ambulatory',     p.ambulatory ?? '?'],
      ].map(([k, val]) => `<tr>
        <td style="padding:5px 8px;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;width:130px">${esc(k)}</td>
        <td style="padding:5px 8px;font-family:${/HGVSc|HGVSp|Nucleotide|AA change/.test(k) ? '"SF Mono",Menlo,monospace' : 'inherit'};font-weight:600">${esc(val)}</td>
      </tr>`).join('');
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        The variant that triggers the mechanism cascade for this patient. Downstream chips (Transcript / Protein / Downstream / Cell Type / Tissue Type / Phenotype) propagate from these values.
      </div>
      <table style="width:100%;border-collapse:collapse;background:var(--tile);border-radius:4px;overflow:hidden">${rows}</table>`;
    }

    // ---------------- Q1.1 — variants table across cohort ----------------
    case 'variants_table': {
      const f = a.filter || {};
      const patients = (DATA.patients || []).filter(x => {
        const v = x.variant || {};
        if (f.consequence && !(v.consequence || '').toLowerCase().includes(f.consequence.toLowerCase())) return false;
        if (f.acmg && (v.acmg || '').toUpperCase() !== f.acmg.toUpperCase()) return false;
        return true;
      });
      const rows = patients.map(x => {
        const v = x.variant || {};
        const isMe = x.id === p.id;
        return `<tr style="${isMe ? 'background:var(--accent-soft)' : ''}">
          <td style="font-family:'SF Mono',Menlo,monospace;color:var(--ink-2)">${esc(x.id)}${isMe ? ' <span style="color:var(--accent);font-weight:700">← this patient</span>' : ''}</td>
          <td>${esc(v.exon ?? '?')}</td>
          <td style="font-family:'SF Mono',Menlo,monospace">${esc(v.nucleotide ?? '?')}</td>
          <td>${esc(v.aaChange ?? '')}</td>
          <td>${esc(v.consequence ?? '?')}</td>
          <td style="text-align:center;font-weight:600">${esc(v.acmg ?? '')}</td>
          <td style="color:var(--ink-3);font-size:11px">${esc(x.phenotype ?? '')}</td>
        </tr>`;
      }).join('');
      const filterLbl = Object.keys(f).length
        ? ` · filtered: ${Object.entries(f).map(([k,v]) => `${k}=${v}`).join(', ')}`
        : '';
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:6px">
        ${patients.length} of ${(DATA.patients || []).length} pathogenic variants${esc(filterLbl)}. Each row is one patient's index variant. Source: <b>ClinVar + Zhang cohort</b>.
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="border-bottom:1px solid var(--line-2);color:var(--ink-3);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.05em">
            <th style="padding:6px 4px">Patient</th>
            <th style="padding:6px 4px">Exon</th>
            <th style="padding:6px 4px">HGVSc</th>
            <th style="padding:6px 4px">AA change</th>
            <th style="padding:6px 4px">Consequence</th>
            <th style="padding:6px 4px;text-align:center">ACMG</th>
            <th style="padding:6px 4px">Phenotype</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // ---------------- Q2.1 — NMD trigger vs escape ----------------
    case 'nmd_status': {
      const v = p.variant || {};
      const cons = (v.consequence || '').toLowerCase();
      // Heuristic mirroring the aenmd rules baked upstream: PTC-generating
      // variants in non-terminal exons trigger NMD; splice + missense
      // typically don't. Backed by the nmd_cohort premise where present.
      const nmdPrem = dataPatientPremise(p, 'nmd_cohort');
      const isPTC = /frameshift|nonsense/.test(cons);
      const isSplice = /splice/.test(cons);
      const verdict = isPTC ? 'triggers NMD (loss-of-transcript)'
                   : isSplice ? 'may cause aberrant splicing — NMD depends on downstream frame'
                   : 'unlikely to trigger NMD';
      const verdictColor = isPTC ? 'var(--bad)' : isSplice ? 'var(--warn)' : 'var(--good)';
      const rationale = nmdPrem?.rationale
        || `Consequence <b>${esc(v.consequence || '?')}</b> at exon <b>${esc(v.exon || '?')}</b>. Terminal-exon PTCs typically escape NMD; non-terminal-exon PTCs typically trigger it.`;
      return `<div style="font-size:12px;line-height:1.5">
        <div style="padding:10px;background:var(--tile);border-left:3px solid ${verdictColor};border-radius:4px;margin-bottom:8px">
          <b style="color:${verdictColor}">${esc(verdict)}</b>
        </div>
        <b>Variant:</b> ${esc(v.nucleotide || '?')} · exon ${esc(v.exon || '?')} · ${esc(v.consequence || '?')} · ACMG ${esc(v.acmg || '?')}<br>
        <b>Reasoning:</b> ${rationale}
        ${nmdPrem ? `<br><br><span style="color:var(--ink-3);font-size:11px">Source: <b>${esc(nmdPrem.sourceId)}</b> · premise <code>${esc(nmdPrem.premiseId)}</code></span>` : ''}
      </div>`;
    }

    // ---------------- Q2.2 — AbSplice per-tissue predictions ----------------
    case 'absplice': {
      const prem = dataPatientPremise(p, 'absplice');
      if (!prem) return roadmapStub('AbSplice per-tissue predictions',
        'No AbSplice premise attached to this patient — likely because the curated TSV does not contain a row for this variant.', 'AbSplice v1.0');
      const f = a.filter || {};
      const tissueFilter = (f.tissue || '').toLowerCase();
      const scores = prem.evidence?.tissue_scores || {};
      const max = Math.max(0.5, ...Object.values(scores));
      const entries = Object.entries(scores)
        .filter(([tissue]) => !tissueFilter || tissue.toLowerCase().includes(tissueFilter))
        .sort((a, b) => b[1] - a[1]);
      const rows = entries.map(([tissue, v]) => dataBarRow(tissue, v, max, {
          color: v >= 0.5 ? 'var(--bad)' : v >= 0.2 ? 'var(--warn)' : 'var(--accent)',
        })).join('');
      const filterLbl = tissueFilter
        ? ` · filtered to tissues matching "${tissueFilter}" (${entries.length} of ${Object.keys(scores).length})`
        : '';
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        Category <b>${esc(prem.evidence?.category || '?')}</b>${esc(filterLbl)}. Threshold: <span style="color:var(--bad)">≥ 0.5</span> = high splice-disruption confidence, <span style="color:var(--warn)">0.2 – 0.5</span> = moderate, <span style="color:var(--accent)">&lt; 0.2</span> = negligible.
      </div>${rows || '<div class="pc-data-roadmap-body">No tissues match the filter.</div>'}
      <div style="margin-top:8px;color:var(--ink-3);font-size:11px">Rationale: ${esc(prem.rationale)}</div>`;
    }

    // ---------------- Q2.3 — HPA cell type expression rank ----------------
    case 'hpa_cells': {
      const f = a.filter || {};
      const tf = (f.tissue || '').toLowerCase();
      const sf = (f.status || '').toLowerCase();
      const all = [...(p.cellTypeImpact || [])];
      const cells = all
        .filter(c => !tf || (c.tissue || '').toLowerCase().includes(tf))
        .filter(c => !sf || (c.status || '').toLowerCase() === sf)
        .sort((x, y) => y.score - x.score);
      if (!cells.length) return `<div class="pc-data-roadmap-body">No cell types match this filter (tissue="${esc(tf)}" status="${esc(sf)}"). Cohort has ${all.length} cell types total.</div>`;
      const max = cells[0].score;
      const rows = cells.map(c => {
        const color = c.status === 'hit'    ? 'var(--bad)'
                    : c.status === 'spared' ? 'var(--good)'
                    : 'var(--warn)';
        return dataBarRow(`${c.name} · ${c.tissue}`, c.score, max, {
          color, hint: `[${c.status}]`,
          fmt: v => v.toFixed(1),
        });
      }).join('');
      const filterLbl = (tf || sf)
        ? ` · filtered${tf ? ` tissue~"${tf}"` : ''}${sf ? ` status="${sf}"` : ''} (${cells.length} of ${all.length})`
        : '';
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        ${cells.length} DMD-expressing cell types${esc(filterLbl)}. Bars = curated expression score. Color = per-patient impact (<span style="color:var(--bad)">hit</span> · <span style="color:var(--warn)">partial</span> · <span style="color:var(--good)">spared</span>).
      </div>${rows}`;
    }

    // ---------------- Q2.4 — Bulk tissue expression (GTEx-adjacent) ----------------
    case 'gtex_tissues': {
      const f = a.filter || {};
      const only = (f.hit_status || '').toLowerCase();
      const hit = only && only !== 'hit' ? [] : [...(p.tissuesHit || [])].sort();
      const spared = only && only !== 'spared' ? [] : [...(p.tissuesSpared || [])].sort();
      const total = hit.length + spared.length;
      if (!total) return `<div class="pc-data-roadmap-body">No tissue data matches filter <code>hit_status=${esc(only)}</code>.</div>`;
      const chip = (t, cls) => `<span style="display:inline-block;padding:3px 8px;margin:2px;border-radius:4px;font-size:11px;background:${cls === 'hit' ? 'var(--bad-soft, #fce4e4)' : 'var(--good-soft, #d9f0dc)'};color:${cls === 'hit' ? 'var(--bad)' : 'var(--good)'}">${esc(t)}</span>`;
      const filterLbl = only ? ` · filtered hit_status=${only}` : '';
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        Tissue projection derived from the isoform × tissue table (curated)${esc(filterLbl)}. Rank-by-expression is <b>roadmap</b> — needs a GTEx bulk index.
      </div>
      ${hit.length ? `<b style="color:var(--bad);font-size:11px">Hit (${hit.length})</b><br>${hit.map(t => chip(t, 'hit')).join('')}<br><br>` : ''}
      ${spared.length ? `<b style="color:var(--good);font-size:11px">Spared (${spared.length})</b><br>${spared.map(t => chip(t, 'spared')).join('')}` : ''}`;
    }

    // ---------------- Q2.5 — Isoform × tissue coverage grid ----------------
    case 'isoform_grid': {
      const f = a.filter || {};
      const isof = (f.isoform || '').toLowerCase();
      const tisf = (f.tissue  || '').toLowerCase();
      const isos = (p.isoformImpact || []).filter(i => !isof || i.id.toLowerCase().includes(isof));
      if (!isos.length) return `<div class="pc-data-roadmap-body">No isoforms match filter <code>isoform~"${esc(isof)}"</code>.</div>`;
      const allTissues = Array.from(new Set(isos.flatMap(i => i.tissues || [])))
        .filter(t => !tisf || t.toLowerCase().includes(tisf))
        .sort();
      if (!allTissues.length) return `<div class="pc-data-roadmap-body">No tissues match filter <code>tissue~"${esc(tisf)}"</code>.</div>`;
      const header = `<tr>
        <th style="padding:6px 4px;text-align:left;font-size:10px;text-transform:uppercase;color:var(--ink-3)">Isoform</th>
        <th style="padding:6px 4px;text-align:left;font-size:10px;text-transform:uppercase;color:var(--ink-3)">Hit?</th>
        ${allTissues.map(t => `<th style="padding:6px 4px;font-size:9px;color:var(--ink-3);writing-mode:vertical-rl;text-orientation:mixed;height:80px">${esc(t)}</th>`).join('')}
      </tr>`;
      const rows = isos.map(i => {
        const hitCells = allTissues.map(t => {
          const carries = (i.tissues || []).includes(t);
          if (!carries) return `<td style="padding:4px;text-align:center;color:var(--ink-3)">–</td>`;
          const color = i.hit ? 'var(--bad)' : 'var(--good)';
          const glyph = i.hit ? '●' : '○';
          return `<td style="padding:4px;text-align:center;color:${color};font-size:14px" title="${esc(i.id)} carries ${esc(t)} — isoform ${i.hit ? 'hit' : 'spared'}">${glyph}</td>`;
        }).join('');
        return `<tr>
          <td style="padding:4px 6px;font-family:'SF Mono',Menlo,monospace;font-weight:600">${esc(i.id)}</td>
          <td style="padding:4px 6px;color:${i.hit ? 'var(--bad)' : 'var(--good)'};font-weight:600">${i.hit ? 'hit' : 'spared'}</td>
          ${hitCells}
        </tr>`;
      }).join('');
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        ${isos.length} DMD isoforms × ${allTissues.length} tissues. <span style="color:var(--bad)">●</span> = isoform hit by variant AND expressed here; <span style="color:var(--good)">○</span> = isoform spared but expressed here; <span style="color:var(--ink-3)">–</span> = isoform not expressed in this tissue.
      </div>
      <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px">${header}${rows}</table></div>`;
    }

    // ---------------- PH.1 — Group patient lab profiles by variant consequence ----------------
    case 'labs_by_consequence': {
      const patients = DATA.patients || [];
      if (!patients.length) return `<div class="pc-data-roadmap-body">No patients.</div>`;
      // Collect all lab keys seen across the cohort, ordered by layer.
      const labMeta = new Map();
      for (const x of patients) {
        for (const l of (x.labs || [])) {
          if (!labMeta.has(l.key)) {
            labMeta.set(l.key, { label: l.label || l.key, layer: l.layer || 'other', tissue: l.tissue || '' });
          }
        }
      }
      const labKeys = [...labMeta.keys()].sort((a, b) => {
        const la = labMeta.get(a).layer, lb = labMeta.get(b).layer;
        const order = ['cellType', 'tissueType', 'phenotype', 'other'];
        return (order.indexOf(la) - order.indexOf(lb)) || a.localeCompare(b);
      });
      // Group patients by variant consequence
      const groups = {};
      for (const x of patients) {
        const c = x.variant?.consequence || 'unknown';
        (groups[c] ||= []).push(x);
      }
      const groupOrder = ['Frameshift', 'Nonsense', 'Splice-site', 'Missense']
        .filter(g => groups[g]);
      for (const g of Object.keys(groups)) if (!groupOrder.includes(g)) groupOrder.push(g);

      const CELL_W = 34, LABEL_H = 100;
      const cellFor = (labKey, patient) => {
        const lab = (patient.labs || []).find(l => l.key === labKey);
        if (!lab) return `<td style="width:${CELL_W}px;padding:3px;background:var(--tile)" title="not measured"></td>`;
        const flag = lab.flag || 'normal';
        const bg = flag === 'high'   ? 'rgba(201,74,74,0.85)'
                 : flag === 'low'    ? 'rgba(215,138,43,0.85)'
                 : 'rgba(200,200,205,0.35)';
        const glyph = flag === 'high' ? '▲' : flag === 'low' ? '▼' : '';
        const color = flag !== 'normal' ? 'white' : 'var(--ink-3)';
        const tip = `${patient.id} · ${lab.label}: ${lab.value} ${lab.unit || ''} [${flag}]`;
        return `<td style="width:${CELL_W}px;padding:3px;background:${bg};color:${color};text-align:center;font-size:11px;font-weight:700" title="${esc(tip)}">${glyph}</td>`;
      };

      // Group summary row: % of patients in this group with any abnormal for that lab
      const summaryFor = (labKey, group) => {
        const n = group.length;
        const abn = group.filter(x => {
          const lab = (x.labs || []).find(l => l.key === labKey);
          return lab && lab.flag && lab.flag !== 'normal';
        }).length;
        if (!n) return `<td style="width:${CELL_W}px"></td>`;
        const frac = abn / n;
        const alpha = 0.1 + 0.7 * frac;
        return `<td style="width:${CELL_W}px;padding:4px 3px;text-align:center;font-size:10px;font-weight:700;color:${frac > 0.5 ? 'white' : 'var(--ink-2)'};background:rgba(37,99,235,${alpha.toFixed(2)})"
                  title="${abn}/${n} abnormal in group">${abn}/${n}</td>`;
      };

      const headerRow = `<tr>
        <th style="text-align:left;padding:4px 8px;font-size:10px;text-transform:uppercase;color:var(--ink-3);letter-spacing:0.05em">group / patient</th>
        <th style="text-align:left;padding:4px 8px;font-size:10px;text-transform:uppercase;color:var(--ink-3);letter-spacing:0.05em">exon</th>
        ${labKeys.map(k => `<th style="width:${CELL_W}px;height:${LABEL_H}px;vertical-align:bottom;padding:2px 0;font-size:10px;color:var(--ink-2);text-align:center"><div style="writing-mode:sideways-rl;white-space:nowrap;text-align:left">${esc(labMeta.get(k).label)}</div></th>`).join('')}
      </tr>`;

      const groupBlocks = groupOrder.map(g => {
        const pats = groups[g];
        const summaryCells = labKeys.map(k => summaryFor(k, pats)).join('');
        const summaryRow = `<tr style="background:var(--tile)">
          <td colspan="2" style="padding:5px 8px;font-weight:700;color:var(--ink);text-transform:uppercase;font-size:11px;letter-spacing:0.05em;border-top:2px solid var(--accent)">${esc(g)} · n=${pats.length}</td>
          ${summaryCells}
        </tr>`;
        const patientRows = pats.map(x => `<tr>
          <td style="padding:3px 8px;font-family:'SF Mono',Menlo,monospace;font-size:11px">${esc(x.id)}</td>
          <td style="padding:3px 8px;font-size:11px;color:var(--ink-2)">${esc(x.variant?.exon || '?')}</td>
          ${labKeys.map(k => cellFor(k, x)).join('')}
        </tr>`).join('');
        return summaryRow + patientRows;
      }).join('');

      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        10 patients grouped by variant consequence. <span style="background:rgba(201,74,74,0.85);color:white;padding:1px 5px;border-radius:2px">▲ high</span> · <span style="background:rgba(215,138,43,0.85);color:white;padding:1px 5px;border-radius:2px">▼ low</span> · empty = within reference range. Group-header row shows <b>fraction abnormal</b> for that lab in the group (blue tint intensity = fraction).
      </div>
      <div style="overflow-x:auto">
        <table style="border-collapse:collapse;font-size:11px">
          <thead>${headerRow}</thead>
          <tbody>${groupBlocks}</tbody>
        </table>
      </div>`;
    }

    // ---------------- Q2.6 — NMD status vs symptom count (cohort) ----------------
    case 'nmd_vs_symptom': {
      const buckets = { 'NMD-trigger': [], 'splice': [], 'other': [] };
      for (const x of (DATA.patients || [])) {
        const cons = (x.variant?.consequence || '').toLowerCase();
        const bucket = /frameshift|nonsense/.test(cons) ? 'NMD-trigger'
                     : /splice/.test(cons)                ? 'splice'
                     : 'other';
        const abn = (x.labs || []).filter(l => l.flag !== 'normal').length;
        buckets[bucket].push({ id: x.id, abn });
      }
      const rows = Object.entries(buckets).map(([grp, xs]) => {
        if (!xs.length) return `<tr><td style="padding:6px;color:var(--ink-3)">${esc(grp)}</td><td colspan="3" style="color:var(--ink-3)">no patients in this bucket</td></tr>`;
        const mean = xs.reduce((s, x) => s + x.abn, 0) / xs.length;
        const dots = xs.map(x => `<span title="${esc(x.id)}: ${x.abn} abnormal labs" style="display:inline-block;width:14px;text-align:center;color:var(--accent);font-family:'SF Mono',Menlo,monospace">${x.abn}</span>`).join('');
        return `<tr>
          <td style="padding:6px;font-weight:600">${esc(grp)}</td>
          <td style="padding:6px;color:var(--ink-2)">n = ${xs.length}</td>
          <td style="padding:6px;color:var(--ink-2)">mean ${mean.toFixed(1)}</td>
          <td style="padding:6px">${dots}</td>
        </tr>`;
      }).join('');
      return `<div style="font-size:11px;color:var(--ink-2);margin-bottom:8px">
        Per-patient abnormal-lab count grouped by predicted NMD outcome. Bucketing is derived from variant consequence (frameshift/nonsense → trigger; splice → conditional). <b>Cohort n = ${(DATA.patients || []).length}</b> — data-thin, statistical test not run.
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="border-bottom:1px solid var(--line-2);color:var(--ink-3);text-align:left;font-size:10px;text-transform:uppercase">
          <th style="padding:6px">Bucket</th><th style="padding:6px">Patients</th><th style="padding:6px">Mean abnormal labs</th><th style="padding:6px">Per-patient count</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // ---------------- Q3.1 — ESM3 fold ----------------
    case 'esm3_fold': {
      // Would render a 3Dmol view of the cached PDB for this patient's
      // variant. Cache is host-populated; on this box it's empty, so
      // degrade honestly with a description of what would appear.
      const v = p.variant || {};
      return `<div class="pc-data-roadmap-body">
        <b>ESM3 fold — not cached on this host.</b><br><br>
        Would render a <b>3Dmol side-by-side viewer</b> of:<br>
        &nbsp;&nbsp;· Wild-type dystrophin (P11532)<br>
        &nbsp;&nbsp;· Truncated variant predicted from ${esc(v.aaChange || v.nucleotide || 'this variant')}<br>
        with the variant residue highlighted red and pLDDT + pTM confidence overlaid.<br><br>
        <b>Would come from:</b> <span style="color:var(--ink-3)">ESM3 Forge · cached under <code>cache/esm3/&lt;uniprot&gt;/</code></span>. The compute happens off-box; this workbench only reads cached PDBs.
      </div>`;
    }

    // ---------------- Q4.1 — Open Targets ----------------
    case 'opentargets': {
      const ot = MECH_DATA?.openTargets;
      if (!ot) return roadmapStub('Open Targets molecular interactors',
        'openTargets block missing from mechanism_data.json — re-run hydrate_mechanism_view.', 'Open Targets GraphQL');
      const section = (a.filter?.section || '').toLowerCase();
      const showDrugs        = !section || section === 'drugs';
      const showInteractions = !section || section === 'interactions';
      const showPathways     = !section || section === 'pathways';
      const approved = (ot.drugs || []).filter(d => d.maxStage === 'APPROVAL').slice(0, 10);
      const drugsBlock = !showDrugs ? '' : `
        <div style="font-size:10px;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;font-weight:700">Approved drugs (${approved.length})</div>
        <ul style="padding-left:16px;margin:0 0 12px 0">${approved.length
          ? approved.map(d => `<li style="margin-bottom:2px"><b>${esc(d.name)}</b> <span style="color:var(--ink-3)">· ${esc(d.type)} · ${esc(d.maxStage)}</span></li>`).join('')
          : '<li style="color:var(--ink-3)">no approved drugs found</li>'}</ul>`;
      const pathwaysBlock = !showPathways ? '' : `
        <div style="font-size:10px;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px 0;font-weight:700">Reactome pathways (${(ot.pathways || []).length})</div>
        <ul style="padding-left:16px;margin:0">${(ot.pathways || []).slice(0, 10)
          .map(p => `<li style="margin-bottom:2px"><b>${esc(p.name)}</b> <span style="color:var(--ink-3)">· ${esc(p.topLevel)}</span></li>`).join('')}</ul>`;
      const interactorsBlock = !showInteractions ? '' : `
        <div style="font-size:10px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;font-weight:700">Top molecular interactors (${(ot.interactions || []).length})</div>
        ${(ot.interactions || []).slice(0, 10).map(x =>
          dataBarRow(`${x.symbol} (${x.source})`, x.score, 1.0, { color: 'var(--accent)' })).join('')}`;
      const twoCol = showDrugs && showInteractions;
      const grid = twoCol
        ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px"><div>${drugsBlock}${pathwaysBlock}</div><div>${interactorsBlock}</div></div>`
        : `<div style="font-size:12px">${drugsBlock}${interactorsBlock}${pathwaysBlock}</div>`;
      const filterLbl = section ? ` · filtered to <b>${esc(section)}</b>` : '';
      return `${grid}
      <div style="margin-top:10px;color:var(--ink-3);font-size:11px">
        Source: <b>Open Targets</b>${filterLbl} · target <code>${esc(ot.ensemblId || '')}</code> · refreshed <code>${esc(ot.refreshedAt || '?')}</code>
      </div>`;
    }

    // ---------------- Q5 — synthesis: route to Mechanism tab ----------------
    case 'route_to_mech': {
      const nHyp = (p.hypothesisRanking || []).length;
      return `<div style="font-size:12px;line-height:1.6">
        Synthesis is the job of the <b>Explore Mechanism</b> tab. Data views (chart-first) can tell you <em>what</em> is disrupted — mechanism views tell you <em>how</em> the disruption chain reaches the observed symptoms.<br><br>
        This patient's mechanism space: <b>${nHyp} surviving hypotheses</b> (pruned from 4 templates, one-per-mechanism-family). Each is a chain: variant → protein → pathway → cell type → tissue → phenotype, with per-link premises + Pareto ranking on confidence × severity × treatability.<br><br>
        <button data-jump-mechanism style="background:var(--accent);color:white;border:none;padding:8px 14px;border-radius:6px;font:inherit;font-weight:600;font-size:12px;cursor:pointer">
          Switch to Explore Mechanism →
        </button>
      </div>`;
    }
    // Roadmap stubs — final for iteration 1
    case 'esm2_llr':
      return roadmapStub('ESM2 log-likelihood ratio (LLR)',
        'Would show a bar of LLR at this patient\'s variant position vs the WT baseline distribution across all dystrophin residues. Requires an ESM2 masked-marginal pass per variant.',
        'ESM2 (Meta AI)');
    case 'llr_vs_symptom':
      return roadmapStub('LLR vs syndromic score',
        'Cross-cohort scatter of per-variant LLR against symptom count, with age as a covariate. Blocked on Q3.2.',
        'ESM2 · patient labs');
    case 'archs4':
      return roadmapStub('ARCHS4 co-expression',
        'Top DMD co-expressed genes + module memberships + pathway enrichment. Would surface secondary targets that move together with dystrophin across ~380k human samples.',
        'ARCHS4');
    case 'string':
      return roadmapStub('STRING interaction network',
        'DMD\'s direct protein interactors + complex members + pathway neighbors. Would render as a small node-edge diagram with confidence-weighted edges.',
        'STRING v12');
    case 'geneformer':
      return roadmapStub('Geneformer perturbation',
        'In-silico DMD knockout in muscle-relevant cell states, ranked by downstream expression shift. Would surface cell types most sensitive to loss of dystrophin.',
        'Geneformer');
    case 'cmap':
      return roadmapStub('CMap rescue candidates',
        'Small molecules + genetic perturbations whose transcriptional signature reverses the DMD-loss signature. Would surface repurposable candidates.',
        'Connectivity Map (Broad)');
    default:
      return `<div class="pc-data-roadmap-body">
        Unknown renderer <code>${esc(a.renderer)}</code>. Add it to the switch in <code>renderDataArtifactBody</code>.
      </div>`;
  }
}

function roadmapStub(title, description, source) {
  return `<div class="pc-data-roadmap-body">
    <b>${esc(title)}</b> — not baked yet.<br><br>
    ${esc(description)}<br><br>
    <b>Would come from:</b> <span style="color:var(--ink-3)">${esc(source)}</span>
  </div>`;
}
