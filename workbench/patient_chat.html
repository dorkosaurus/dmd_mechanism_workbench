// ================================================================
// EDGE MODAL
// ================================================================
function renderEdgeModal(p) {
  if (!currentEdgeId || !MECH_DATA || !currentHypId) return '';
  const byId = Object.fromEntries(MECH_DATA.hypotheses.map(h => [h.id, h]));
  const hyp = byId[currentHypId];
  if (!hyp?.detail?.chain) return '';
  const edge = hyp.detail.chain.edges.find(e => (e.id || `${e.from}-${e.to}`) === currentEdgeId);
  if (!edge) return '';
  const byNode = Object.fromEntries(hyp.detail.chain.nodes.map(n => [n.id, n]));
  const fn = byNode[edge.from], tn = byNode[edge.to];
  const fromLbl = fn ? `${fn.label1} ${fn.label2 || ''}`.trim() : edge.from;
  const toLbl   = tn ? `${tn.label1} ${tn.label2 || ''}`.trim() : edge.to;
  const rows = (edge.evidence || []).map(e => `
    <li>
      <span class="tick">${e.tone === 'warn' ? '!' : '✓'}</span>
      <span>${esc(e.text)}<span class="cite">${esc(e.cite || '')}</span></span>
    </li>`).join('') || `<div style="color:var(--ink-3);font-size:11px;padding:6px 0;font-style:italic">
      No curated evidence for this edge yet.</div>`;
  return `
    <div class="edge-modal-backdrop" id="edge-modal-backdrop">
      <div class="edge-modal">
        <div class="edge-modal-h">
          <div>
            <div class="edge-modal-title">Edge Evidence</div>
            <div class="edge-modal-arrow"><b>${esc(fromLbl)}</b><span class="arrow-sep">→</span><b>${esc(toLbl)}</b></div>
            <div style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:var(--ink-3);margin-top:4px">
              H${esc(currentHypId)} · ${esc(currentEdgeId)} · ${(edge.evidence || []).length} citation${(edge.evidence || []).length === 1 ? '' : 's'}
            </div>
          </div>
          <button class="edge-modal-close" id="edge-modal-close" aria-label="Close">×</button>
        </div>
        <div class="edge-modal-body">${rows.startsWith('<li') ? `<ul>${rows}</ul>` : rows}</div>
      </div>
    </div>`;
}

// ================================================================
// CHAT PLANNER (canned patterns, patient-scoped)
// ================================================================
function planChat(query, p) {
  const q = (query || '').toLowerCase();
  const byId = Object.fromEntries((MECH_DATA?.hypotheses || []).map(h => [h.id, h]));
  const top = p.hypothesisRanking?.[0];
  const topHyp = top ? byId[top.id] : null;

  // ---- 0. Widget-emitting routes (checked FIRST for specific keywords) ----
  //     These produce a `widgetToOpen` in the plan; ask() will append the
  //     widget artifact after the assistant turn.
  if (/lollipop|cluster.*(on|along).*(protein|amino acid|position)|variant.*(protein) position/.test(q)) {
    return {
      text: `Plotting DMD variant density along the protein axis — marker height = report count, color = predicted consequence class. ` +
            `${patientLabel(p)}'s variant is at exon ${p.variant.exon} (${p.variant.consequence}). ` +
            `Below: a demonstration lollipop map from the widget palette.`,
      widgetToOpen: { widget: 'variantLollipop', title: 'Variant lollipop · DMD protein axis',
        note: `Demonstration data from widget_palette.js. Production would highlight ${patientLabel(p)}'s variant position.` },
    };
  }
  if (/exon (architecture|structure|layout|ruler)|which exons? (encode|contain|make up)|domain (architecture|panel|band)/.test(q)) {
    return {
      text: `DMD's 79 exons encode four functional domains: N-terminal actin-binding (ex 1-8), central rod of 24 spectrin repeats (ex 8-63), cysteine-rich (ex 64-70), and C-terminal syntrophin-binding (ex 71-79). ` +
            `${patientLabel(p)}'s variant sits at exon ${p.variant.exon}.`,
      widgetToOpen: { widget: 'exonArchitecturePanel', title: 'Exon architecture · DMD',
        note: 'PSI values are demonstrative pending a full splicing atlas bake.' },
    };
  }
  if (/isoform.*(cell type|tissue|matrix|heatmap|across)|expression.*isoform.*(cell|tissue)|(cell type|tissue).*isoform|isoform (expression|profile) (matrix|heatmap|grid)/.test(q)) {
    return {
      text: `Heatmap of DMD's 7 isoforms against a cell-type panel — Dp427m in myofibers + cardiomyocytes, Dp260 in retinal photoreceptors, Dp140 in fetal CNS + kidney, Dp116 in Schwann cells, Dp71 broadly. ` +
            `${patientLabel(p)}'s variant hits isoforms whose promoter fires ≤ exon ${p.variant.exonNum || '?'}.`,
      widgetToOpen: { widget: 'heatmap', title: 'Isoform × cell type expression heatmap',
        note: 'Demonstration matrix; a broader single-cell atlas bake would be needed for real values.' },
    };
  }
  if (/linked heatmap|link.*(variant|pathway|cell type).*(cell type|pathway)|cross[- ]?axis|connect.*(variant|pathway|cell type)/.test(q)) {
    return {
      text: `Linked heatmap joins three axes: variant classes → cell types → pathways. Cell type is the shared middle axis. ` +
            `Answers "which variant classes hit which cell types, and which processes those cell types drive."`,
      widgetToOpen: { widget: 'linkedHeatmap', title: 'Linked heatmap · variants ↔ cell types ↔ pathways',
        note: 'Demonstration matrix; production would compute pathogenicity-weighted overlaps.' },
    };
  }
  if (/cohort (distribution|breakdown)|phenotype distribution|becker fraction|donut|dmd\/bmd fraction/.test(q)) {
    return {
      text: `Cohort phenotype distribution from Zhang 2024 (N=2,097): DMD ~81%, BMD ~15%, IMD ~2%, pending ~2%. ` +
            `${patientLabel(p)}'s label is <b>${p.phenotype}</b>.`,
      widgetToOpen: MECH_DATA?.tiles?.phenotypeDist ? {
        widget: 'donutBreakdown',
        title: 'Phenotype distribution (cohort donut)',
        props: { title: 'Phenotype Distribution', ...MECH_DATA.tiles.phenotypeDist },
      } : null,
    };
  }
  if (/variant class(es)?|variant type|structural vs snv|snv vs structural|stackedbar|variant landscape/.test(q)) {
    return {
      text: `DMD variant landscape (LOVD 41,566 reports, ~10,136 unique): structural ~73%, SNV ~25%, other ~2%. Deletions dominate due to the 2.3 Mb locus + repetitive introns → non-allelic homologous recombination.`,
      widgetToOpen: MECH_DATA?.tiles?.geneticEvidence ? {
        widget: 'stackedBar',
        title: 'DMD variant landscape (cohort)',
        props: { title: 'DMD Variant Landscape', ...MECH_DATA.tiles.geneticEvidence },
      } : null,
    };
  }
  if (/evidence (supports|for) (the|a|any).*(step|edge|arrow|link)|edge evidence|citations? for.*(step|edge|arrow)|why does.*imply|genotype.*protein step/.test(q)) {
    if (topHyp?.detail?.chain) {
      const edges = topHyp.detail.chain.edges;
      const edge = edges.find(e => e.evidence && e.evidence.length) || edges[0];
      return {
        text: `Each arrow in the reasoning chain carries citation-backed evidence. Here's one edge from H${top.id}'s chain with its citation list — in the chain artifact you can click any arrow to open the same view in a modal.`,
        widgetToOpen: {
          widget: 'edgeEvidenceBar',
          title: `Edge evidence · H${top.id} · ${edge.from} → ${edge.to}`,
          props: { edge, evidence: edge.evidence || [] },
        },
      };
    }
  }
  if (/hypothesis detail|full hypothesis|hypothesis pack|hypothesis card|lede.*evidence/.test(q)) {
    if (topHyp && topHyp.detail) {
      return {
        text: `Full hypothesis detail pack for H${top.id} — lede + curated evidence bullets + reasoning chain, from widget_palette.hypothesisDetail.`,
        widgetToOpen: {
          widget: 'hypothesisDetail',
          title: `Hypothesis detail · H${top.id}: ${topHyp.name}`,
          props: { hypothesis: topHyp, selectedEdgeId: null },
        },
      };
    }
  }
  if (/3d|structure|esm3|fold|protein.?structure|show.*(protein|structure).*(patient|variant)|where.*variant.*(sit|land|in.*protein|structure)/.test(q)) {
    const key = `${p.cohort}#${p.cohortPatientId}`;
    const fold = ESM3_FOLDS?.[key];
    if (fold) {
      return {
        text: `Loading the ESM3-predicted 3D structure of ${fold.isoform} (${fold.length} aa) with ${patientLabel(p)}'s variant residue (${fold.variantLabel}) highlighted. Drag to rotate; the red-highlighted residue is where the PTC lands.`,
        artifactToOpen: { type: 'esm3_structure' },
      };
    }
    return {
      text: `No ESM3 fold is baked for ${patientLabel(p)} yet. Currently baked: Patient 3 (Trp3083*) and Patient 5 (Ser3552Lysfs*6) on Dp71 (627 aa). Additional isoforms (Dp116, Dp140) will be folded on a bigger box — full-length Dp427m exceeds ESM3's 2046-aa limit.`,
    };
  }
  if (/nmd|nonsense.?mediated decay|marimekko|acmg.*(nmd|categor)|nmd.*(acmg|categor)|ptc.*(distribution|breakdown)|escaping.*(vs|versus).*triggering/.test(q)) {
    return {
      text: `Cross-tabulating ClinVar's ${MECH_DATA?.nmdCohort?.total?.toLocaleString('en-US') || '?'} DMD variants by ACMG classification (Benign · Uncertain · Pathogenic) × NMD category (Triggering · Transcript-dependent · Escaping). Column widths = ACMG totals, segment heights = NMD share within each column.`,
      artifactToOpen: { type: 'nmd_marimekko' },
    };
  }
  if (/hbar|bar list|cell.?type resolution|top cell types|hpa cell types/.test(q)) {
    if (MECH_DATA?.tiles?.cellTypes) {
      return {
        text: `hbarList widget from the palette — top ${MECH_DATA.tiles.cellTypes.rows.length} DMD-expressing cell types from Human Protein Atlas (log10-scaled nCPM).`,
        widgetToOpen: {
          widget: 'hbarList', title: 'Cell types (hbarList widget)',
          props: { title: 'Cell Types (Human Protein Atlas)', ...MECH_DATA.tiles.cellTypes },
        },
      };
    }
  }
  if (/gene overview|dmd overview|gene header|gene summar/.test(q)) {
    return {
      text: `DMD encodes dystrophin on Xp21.2 — 79 exons, 7 tissue-specific isoforms, 2.3 Mb locus. ${patientLabel(p)}'s variant at exon ${p.variant.exon} lies within this coding region.`,
      widgetToOpen: MECH_DATA?.gene && MECH_DATA?.header ? {
        widget: 'geneHeader',
        title: 'Gene header · DMD',
        props: { gene: MECH_DATA.gene, header: MECH_DATA.header },
      } : null,
    };
  }

  // ---- Open Targets (drug list + interactors + tractability + pathways) ----
  if (/open ?targets|molecular interactors( and pathways)?|approved drug|delandistrogene|eteplirsen|viltolarsen|golodirsen|casimersen|dgc partners|drug list|downstream molecular interactions|reactome pathway/.test(q)) {
    const ot = MECH_DATA?.openTargets;
    if (!ot) return { text: 'Open Targets data not baked yet. Run `python3 -m prototype.ingest.bake_opentargets`.' };
    const approved = (ot.drugs || []).filter(d => (d.maxStage || '').toUpperCase() === 'APPROVAL');
    const drugsLine = approved.length
      ? approved.map(d => `${d.name} <span style="color:var(--ink-3)">(${d.type})</span>`).join(' · ')
      : '<i>none approved</i>';
    const pw = (ot.pathways || []).slice(0, 3).map(p => p.name).join(' · ') || '—';
    const inx = (ot.interactions || []).slice(0, 8).map(i => i.symbol).join(' · ') || '—';
    const tractHits = Object.entries(ot.tractability || {}).flatMap(([mod, items]) =>
      items.filter(x => x.value).map(x => `${mod}:${x.label}`));
    return {
      text: `<b>Open Targets · DMD</b> (${ot.ensemblId})<br><br>` +
            `<b>Approved drugs (${approved.length}):</b> ${drugsLine}<br><br>` +
            `<b>Top pathways:</b> ${pw}<br>` +
            `<b>Top molecular interactors:</b> ${inx}<br><br>` +
            `<b>Tractable modalities (${tractHits.length}):</b> ${tractHits.slice(0, 6).join(' · ') || '<i>none flagged</i>'}<br><br>` +
            `Fetched ${ot.refreshedAt?.slice(0, 10)} · <a href="${esc(ot.sourceUrl)}" target="_blank" style="color:var(--accent)">platform.opentargets.org</a>`,
    };
  }

  // ---- LLM-refined narrative / considered-but-discarded / testable predictions ----
  if (/narrative|synthesis|mechanism story|why is this the story|refined claim/.test(q)) {
    const top = p.hypothesisRanking?.[0];
    const rc = top?.refinedClaim;
    const l2 = rc?.layer2;
    if (l2?.narrative) {
      return {
        text: `<b>H${top.id} — synthesized narrative</b> (${l2.model || 'LLM'}):<br><br>` +
              `<i>${esc(l2.narrative)}</i><br><br>` +
              (rc.layer1?.distinguishing ? `<b>Distinguishing evidence:</b> ${esc(rc.layer1.distinguishing)}` : ''),
        hypToOpen: top.id,
      };
    }
    if (rc?.layer1?.claim) {
      return {
        text: `<b>H${top.id} — Layer 1 (deterministic) claim:</b><br><br>${esc(rc.layer1.claim)}<br><br>` +
              `<i>Layer 2 LLM refinement not baked for this run — set ANTHROPIC_API_KEY and re-run bake to enable.</i>`,
        hypToOpen: top.id,
      };
    }
    return { text: 'No refined claim available yet — re-run the bake to populate refinedClaim.' };
  }
  if (/considered.*discard|alternative.*(hypothes|mechanism)|what.*ruled out|what was considered/.test(q)) {
    const top = p.hypothesisRanking?.[0];
    const cbd = top?.refinedClaim?.layer2?.considered_but_discarded;
    if (cbd) {
      return {
        text: `<b>Considered but discarded for H${top.id}:</b><br><br><i>${esc(cbd)}</i>`,
        hypToOpen: top.id,
      };
    }
    return { text: 'No "considered but discarded" statement — Layer 2 LLM refinement is required (set ANTHROPIC_API_KEY and re-bake).' };
  }
  if (/testable|prediction|experiment|would (confirm|falsify)|how.*test/.test(q)) {
    const top = p.hypothesisRanking?.[0];
    const tests = top?.refinedClaim?.layer2?.testable_predictions;
    if (tests?.length) {
      return {
        text: `<b>Testable predictions for H${top.id}:</b><br><br>` +
              tests.map((t, i) => `${i + 1}. ${esc(t)}`).join('<br>'),
        hypToOpen: top.id,
      };
    }
    return { text: 'No testable predictions baked — Layer 2 LLM refinement is required.' };
  }
  if (/contradict|conflicting|opposing (evidence|premises?)|where.*disagree/.test(q)) {
    const ranked = p.hypothesisRanking || [];
    const withContra = ranked.filter(r => (r.scoreVector?.contradictions || []).length);
    if (!withContra.length) {
      return { text: `No detected contradictions across ${ranked.length} hypotheses (a contradiction fires when both positive and negative premises accrue ≥0.1 weight at the same chain position).` };
    }
    const lines = withContra.map(r => {
      const contras = r.scoreVector.contradictions;
      const rows = contras.slice(0, 2).map(c =>
        `  • at <code>${esc(c.position)}</code>: +${c.positiveSum} vs −${c.negativeSum}`).join('<br>');
      return `<b>H${r.id}</b> (${contras.length} contradiction${contras.length === 1 ? '' : 's'}):<br>${rows}`;
    }).join('<br><br>');
    return { text: `<b>Contradictions detected:</b><br><br>${lines}` };
  }

  // ---- Pareto axes (confidence × severity × treatability) — opens 2D scatter ----
  if (/pareto|tradeoff|trade[- ]off|treatab|severity vs|confidence vs|three axis|axes|rank.*(pareto|axis)/.test(q)) {
    return {
      text: `Opening the Pareto ranking artifact — 2D scatter of confidence × treatability, colored by severity. ` +
            `Frontier points (dashed line) are hypotheses that no other hypothesis dominates on both axes.`,
      artifactToOpen: { type: 'pareto_hypotheses' },
    };
  }

  // ---- Substrate explorer ----
  if (/substrate|premise (source|registry|list)|data sources? fired|what.*(sources?|premises?).*(baked|available)|which data|source registry/.test(q)) {
    return {
      text: `Opening the substrate explorer — one row per premise source with counts of baked premises and hypotheses fired against. Highlighted rows are the sources currently feeding ${patientLabel(p)}'s top hypothesis.`,
      artifactToOpen: { type: 'substrate_explorer' },
    };
  }

  // ---- Cell-type ranking match to symptoms ----
  if (/cell.?type.*(rank|order).*(match|explain).*(dmd|symptom)|does.*rank(ing)?.*match/.test(q)) {
    const hits = p.cellTypeImpact.filter(c => c.status === 'hit').map(c => c.name);
    return {
      text: `Cell-type ranking (HPA nCPM) puts <b>myonuclei</b> and <b>cardiomyocytes</b> at the top — matching DMD's dominant symptoms (skeletal muscle wasting + cardiomyopathy). Photoreceptors and adipocytes sit lower but non-zero, explaining the sub-clinical retinal ERG changes and adipose-tissue infiltration seen in later DMD.<br><br>` +
            `For ${patientLabel(p)}, cells impacted: ${hits.join(', ') || '<i>none</i>'}.`,
    };
  }

  // ---- Roadmap questions: return a real explanation of *what's missing*
  //      and *what would need to bake* to answer them. Better than the
  //      "no canned answer" fallback for questions we've deliberately
  //      scoped out of iteration 1.
  const roadmap = [
    { re: /allele[- ]?specific|ASE|allelic imbalance/i,
      answer: `<b>Allele-specific expression (ASE)</b> — not baked. Would require patient-level RNA-seq with matched genotype (WGS or WES) so we can split reads at heterozygous SNPs and compute the reference-vs-alternative allele ratio. Standard tools: ASEReadCounter (GATK), phASER. For X-linked DMD in females it's especially informative — reveals skewed X-inactivation. Ingestion planned: <code>bake_patient_rnaseq.py</code> + heterozygous-site allele-counting step.` },
    { re: /nmd.?trigger.*cardio|nmd.*(associated|correlate).*(cardio|heart)/i,
      answer: `<b>Roadmap</b> — statistical: does NMD-triggering variant class predict cardiac involvement (LVEF < 55 or DCM diagnosis)? Requires a cohort-level cross-tab: rows = NMD category (triggering / transcript-dep / escaping), columns = cardiac status, cell = odds ratio + 95% CI. Substrate is present (clinvar_nmd + patient_labs), just needs one bake script.` },
    { re: /nmd.*(status|category).*predict.*sever|nmd.*(controlling|adjust).*age/i,
      answer: `<b>Roadmap</b> — statistical: NMD-status × syndromic severity, controlling for age. Would fit a logistic model on the Zhang 2024 cohort: <code>severity ~ nmd_category + age + phenotype</code>. Substrate present; ingestion planned: <code>bake_cohort_regressions.py</code>.` },
    { re: /ER retention|endoplasmic reticulum retention/i,
      answer: `<b>Roadmap</b> — no substrate: needs pulse-chase or IF/IEM studies of misfolded dystrophin trafficking. In practice this would come from published biopsy papers (Cohn et al., Ohlendieck) manually curated as literature premises, plus a targeted BioGRID query for ER-quality-control machinery.` },
    { re: /LLR.*(predict|correlate).*symptom/i,
      answer: `<b>Roadmap</b> — statistical (per-symptom): does ESM2 LLR severity predict individual symptom presence (cardiomyopathy, cognitive, retinal)? Would require ESM2 LLR baked across DMD's 3685 residues (~50 GB VRAM) + per-patient symptom vector. Plan: run ESM2 on a bigger box; store <code>llr_by_position</code>; join to <code>patient_symptoms</code>.` },
    { re: /LLR.*syndromic|syndromic.*LLR/i,
      answer: `<b>Roadmap</b> — statistical (syndromic): fit <code>syndromic_score ~ mean_LLR_across_hit_residues + age</code>. Same substrate dependency as the per-symptom question above.` },
    { re: /UK Biobank|proteomics.*(dystrophin|abundance)/i,
      answer: `<b>Roadmap</b> — external cohort: UKB Olink panel includes ~1500 proteins but not full-length dystrophin (2.3 MDa, out of range for affinity-based assays). MS-based dystrophin quant exists in muscle biopsy proteomics (Whitfield 2020, Chase 2018). Would ingest as a cohort_premise tying protein abundance to variant class.` },
    { re: /co-?express.*(ARCHS4|DMD)|ARCHS4/i,
      answer: `<b>Roadmap</b> — needs ARCHS4 fetch: top-100 co-expressed genes with DMD across the ARCHS4 RNA-seq compendium (300K samples). Would land as a <code>gene_coexpression</code> table + cohort premise. Ingestion: <code>bake_archs4_coexpression.py</code> (H5 pull via the S3 endpoint).` },
    { re: /STRING|protein complexes.*(interactor|disrupted)/i,
      answer: `<b>Roadmap</b> — partially covered by Open Targets (interactions table has ~40 STRING partners). A full STRING dump would give edge weights + evidence channels (experimental, database, textmining). Substrate: <code>bake_string.py</code> + <code>protein_interaction</code> table.` },
    { re: /Geneformer|perturbation response.*(DMD|cell)/i,
      answer: `<b>Roadmap</b> — needs Geneformer: single-cell foundation model predicting cell-state response to gene KO. Would run <code>DMD_KO</code> on a myofiber embedding, return top perturbed genes/pathways. Requires GPU + ~30 GB weights; plan: bake on a bigger box, cache <code>data/models/geneformer_dmd_ko.json</code>.` },
    { re: /CMap|drug.*reverse.*signature|connectivity map/i,
      answer: `<b>Roadmap</b> — needs Connectivity Map query: given the DMD-loss transcriptional signature (derived from patient RNA-seq vs baseline), which perturbagens reverse it? Substrate: <code>bake_cmap_query.py</code> against the LINCS L1000 API. Existing approved DMD drugs (see Open Targets) are the strongest prior for what a good hit looks like.` },
  ];
  for (const rm of roadmap) {
    if (rm.re.test(q)) return { text: rm.answer };
  }

  // ---- Altered transcript-level expression (roadmap) ----
  if (/altered expression.*transcript|transcript.?level.*(expression|abundance)|mRNA (level|abundance)/.test(q)) {
    return {
      text: `<b>Roadmap</b>: patient-specific RNA-seq isn't wired yet. In production, we'd overlay the patient's transcript-level abundance (from muscle biopsy RNA-seq or PAXgene blood) against a cohort baseline to confirm the NMD prediction. ` +
            `The current substrate proxies this via <b>isoform_arch × exon position</b> — ${patientLabel(p)}'s variant hits ${p.isoformImpact.filter(i => i.hit).length}/${p.isoformImpact.length} isoforms.<br><br>` +
            `<i>Ingestion script planned: bake_patient_rnaseq.py — reads GTEx-baseline · patient-BAM · runs DESeq2-style residualization.</i>`,
    };
  }

  // ---- 1. Isoform-specific (MUST come before "spared"/"tissue" routes) ----
  const isoMatch = q.match(/dp\s?(427[mcp]?|260|140|116|71)/);
  if (isoMatch) {
    const target = 'Dp' + isoMatch[1].replace(/\s/g, '');
    const iso = p.isoformImpact.find(i => i.id.toLowerCase() === target.toLowerCase());
    if (iso) {
      const status = iso.hit ? '<b>hit</b>' : '<b>spared</b>';
      const tissuesFor = (iso.tissues || []).join(', ') || 'not specified';
      const cellsUsingIt = p.cellTypeImpact
        .filter(c => (c.reason || '').includes(iso.id))
        .map(c => `${c.name} (${c.status})`);
      const consequenceLine = iso.hit
        ? `<b>Consequence:</b> tissues that depend on ${iso.id} (${tissuesFor}) lose dystrophin function in this patient.`
        : `<b>Consequence:</b> tissues carried by ${iso.id} (${tissuesFor}) retain dystrophin — the variant is upstream of ${iso.id}'s promoter (exon ${iso.firstSharedExon}) so ${iso.id} mRNA is unaffected.`;
      return {
        text: `<b>${iso.id}</b> is ${status} for <b>${patientLabel(p)}</b>.<br><br>` +
              `<b>Why:</b> ${esc(iso.reason)}. ${iso.id}'s promoter fires at exon ${iso.firstSharedExon}; this patient's variant is at exon ${p.variant.exon} (${p.variant.consequence}).<br><br>` +
              `<b>Promoter tissue:</b> ${esc(iso.promoterTissue)}<br>` +
              `<b>Expressed in:</b> ${esc(tissuesFor)}<br><br>` +
              consequenceLine +
              (cellsUsingIt.length ? `<br><br><b>HPA cell types touched:</b> ${cellsUsingIt.join(' · ')}.` : ''),
      };
    }
  }

  // ---- 2. "Why is [this/H0X] the top hypothesis?" ----
  if (/why.*(top|rank|hypothesis|first)/.test(q) || /^why h(0?\d)/.test(q)) {
    if (!top || !topHyp) return { text: 'No ranking available.' };
    const pe = (top.patientEvidence || []).length;
    const runners = p.hypothesisRanking.slice(1).map(r =>
      `<b>H${r.id}</b> (score ${r.score.toFixed(1)}, ${(r.patientEvidence || []).length} lab bullets) — <i>${esc(r.fit)}</i>`
    ).join('<br>');
    return {
      text: `<b>H${top.id} — ${esc(topHyp.name)}</b> is top-ranked (score ${top.score.toFixed(1)}/10).<br><br>` +
            `<b>Scoring rule that fired:</b> <i>${esc(top.fit)}</i><br>` +
            `<b>Patient-lab support:</b> ${pe} bullet${pe === 1 ? '' : 's'} argue for this hypothesis in ${patientLabel(p)}${pe ? ' — open the chain to see them' : ''}.<br><br>` +
            `<b>Runners-up:</b><br>${runners}<br><br>` +
            `Ask <i>"compare H${top.id} vs H0X"</i> or <i>"what supports H0X"</i> for the head-to-head.`,
      hypToOpen: top.id,
    };
  }

  // ---- 3. "What supports H0X" / "labs for H0X" ----
  const hypMatch = q.match(/(?:supports?|labs?|evidence|for)\s+h(0?\d)/);
  if (hypMatch) {
    const hid = hypMatch[1].padStart(2, '0');
    const r = p.hypothesisRanking.find(x => x.id === hid);
    const h = byId[hid];
    if (r && h) {
      const pe = r.patientEvidence || [];
      const bullets = pe.length
        ? pe.map(e => `• ${esc(e.text)}`).join('<br>')
        : `<i>No patient labs argue for H${hid} directly.</i>`;
      return {
        text: `<b>H${hid} — ${esc(h.name)}</b> (rank ${r.rank}, score ${r.score.toFixed(1)}, ${pe.length} lab bullets)<br><br>` +
              `<b>Scoring rule:</b> <i>${esc(r.fit)}</i><br><br>` +
              `<b>Patient-lab evidence:</b><br>${bullets}`,
        hypToOpen: hid,
      };
    }
    // H0X was scored but didn't survive the top-3-diverse prune for this patient.
    if (h) {
      const survivors = (p.hypothesisRanking || [])
        .map(x => `H${x.id} (score ${x.score.toFixed(1)})`).join(', ');
      return {
        text: `<b>H${hid} — ${esc(h.name)}</b> was scored for ${patientLabel(p)} but did not survive the top-3-diverse prune. ` +
              `The three surviving hypotheses for this patient are: ${survivors}. ` +
              `Ask <i>"which hypothesis got pruned for this patient, and why?"</i> for the head-to-head.`,
      };
    }
  }

  // ---- 3b. "Which hypothesis got pruned for this patient?" ----
  if (/prune|drop|discard|which.*hypothes.*(?:not|missing|left out|out)/.test(q)) {
    const surviving = new Set((p.hypothesisRanking || []).map(x => x.id));
    const all = ['01', '02', '03', '04'];
    const dropped = all.filter(id => !surviving.has(id));
    if (!dropped.length) return { text: `All 4 templates survived for ${patientLabel(p)} — no prune.` };
    const droppedDesc = dropped.map(id => {
      const meta = byId[id] || {};
      return `<b>H${id} — ${esc(meta.name || '')}</b>`;
    }).join(', ');
    const survivorLine = (p.hypothesisRanking || [])
      .map(x => `H${x.id} (score ${x.score.toFixed(1)})`).join(', ');
    return {
      text: `${droppedDesc} scored too low against ${patientLabel(p)}'s premise bundle to make the top-3-diverse cut. ` +
            `Surviving hypotheses: ${survivorLine}. ` +
            `The prune keeps at most one hypothesis per mechanism family; in Phase 1 each of H01-H04 IS its own family, ` +
            `so top-3-diverse just means "drop the lowest-scoring template". ` +
            `Phase 2 adds LLM-generated mutations that inherit their family from a seed template, ` +
            `at which point diversity does real work.`,
    };
  }

  // ---- 4. Reasoning chain / mechanism ----
  if (/reasoning|chain|mechanism|how does.*(cause|work)|explain/.test(q)) {
    if (!topHyp?.detail?.chain) {
      return { text: `No reasoning chain curated for H${top.id} yet.`, hypToOpen: top.id };
    }
    const n = topHyp.detail.chain.nodes.length;
    const e = topHyp.detail.chain.edges.length;
    return {
      text: `Opening the reasoning chain for <b>H${top.id}</b>. ` +
            `${n} nodes across <i>cause → mechanism → phenotype</i> tiers, connected by ${e} evidence-backed edges. ` +
            `Click any arrow for edge-level citations, or toggle to <b>Layers</b> view for the biological-organization pipeline (variant → protein → pathway → subcellular → cell → tissue → phenotype).<br><br>` +
            (topHyp.detail.lede ? `<i>${esc(topHyp.detail.lede)}</i>` : ''),
      hypToOpen: top.id,
    };
  }

  // ---- 5. Abnormal labs / "what's off" ----
  if (/abnormal|off|out of range|elevated|reduced|what.*labs/.test(q)) {
    const abn = p.labs.filter(l => l.flag !== 'normal');
    if (!abn.length) return { text: `All ${p.labs.length} routine labs are within reference range for ${patientLabel(p)}.` };
    const grouped = abn.map(l => {
      const fold = (l.flag === 'high' && l.refHigh) ? ` (${(l.value / l.refHigh).toFixed(1)}× ULN)`
                 : (l.flag === 'low' && l.refLow)   ? ` (${(l.refLow / l.value).toFixed(1)}× under LLN)` : '';
      return `• <b>${esc(l.label)}</b>: ${l.value} ${esc(l.unit)} [${esc(l.flag)}]${fold}`;
    }).join('<br>');
    return {
      text: `<b>${abn.length}/${p.labs.length} labs abnormal</b> for ${patientLabel(p)}:<br><br>${grouped}`,
    };
  }

  // ---- 6a. Compare to typical / cohort (checked BEFORE compare-hypotheses
  //          and phenotype routes, since "typical DMD patient" contains both
  //          "compare" and "DMD" keywords that other routes would otherwise
  //          grab) ----
  if (/typical|classical|usual|average/.test(q)) {
    const hitIso = p.isoformImpact.filter(i => i.hit).map(i => i.id);
    const sparedIso = p.isoformImpact.filter(i => !i.hit).map(i => i.id);
    return {
      text: `<b>Typical DMD</b> = truncating variant → total Dp427m loss → cardiomyopathy + respiratory failure by teens.<br><br>` +
            `<b>${patientLabel(p)}:</b> ${p.variant.consequence} at exon ${p.variant.exon}, hitting ${hitIso.length} isoforms (${hitIso.join(', ')}) and sparing ${sparedIso.length} (${sparedIso.join(', ') || 'none'}).<br><br>` +
            (p.phenotype === 'BMD'
              ? `BMD suggests in-frame rescue keeps some functional dystrophin — atypical for a truncating variant.`
              : p.phenotype === 'IMD'
              ? `IMD is a boundary label — this variant produces intermediate severity, possibly via partial NMD escape.`
              : `The isoform impact matches a classical severe presentation.`),
    };
  }

  // ---- 6b. Compare hypotheses — opens the 4-column compare artifact ----
  const cmpMatch = q.match(/compar.*(?:hypothes|h0?\d|rank|top|surviv)|h(0?\d).*(?:vs|versus|or)\s*h(0?\d)|side.?by.?side|four.column|4.column|all four hypothes|surviv.*hypothes/)
                || (q.startsWith('compare') && /hypothes|rank/.test(q));
  if (cmpMatch) {
    const nVars = Object.keys(p.hypothesisRankingByVariant || {}).length || 1;
    const nHyps = (p.hypothesisRanking || []).length;
    const perVarNote = nVars > 1 ? ` across ${nVars} pathogenic variants` : '';
    return {
      text: `Opening cross-hypothesis compare artifact for ${patientLabel(p)} — top ${nHyps} mechanism-diverse hypotheses${perVarNote}, each column showing its Pareto axes and top premise contributions.`,
      artifactToOpen: { type: 'compare_hypotheses' },
    };
  }

  // ---- 7. Tissues (only if isoform check didn't match) ----
  if (/tissue|which tissue|what tissue|which organ|body/.test(q) || /spared|hit/.test(q)) {
    return {
      text: `Given ${patientLabel(p)}'s variant at exon ${p.variant.exon}:<br><br>` +
            `<b>${p.tissuesHit.length} tissues hit</b> — ${p.tissuesHit.join(', ')}<br>` +
            `<b>${p.tissuesSpared.length} tissues spared</b> — ${p.tissuesSpared.join(', ')}<br><br>` +
            `Projection: an isoform is hit iff <code>first_shared_exon ≤ ${p.variant.exonNum}</code> — that determines which tissues lose dystrophin.`,
    };
  }

  // ---- 8. Cell types ----
  if (/cell type|myonuclei|photoreceptor|cardiomyocyte/.test(q)) {
    const hits = p.cellTypeImpact.filter(c => c.status === 'hit');
    const spared = p.cellTypeImpact.filter(c => c.status === 'spared');
    const rows = [...hits, ...spared].map(c =>
      `• <b>${esc(c.name)}</b> [${esc(c.status)}] — ${esc(c.reason)}`).join('<br>');
    return {
      text: `HPA cell-type map for ${patientLabel(p)}:<br><br>${rows}<br><br>` +
            `Mapping curated from Muntoni 2003 (Dp427m in muscle), Pillers 1993 (Dp260 in retina), Lidov 1995 (Dp71 ubiquitous).`,
    };
  }

  // ---- 9. Therapy / treatment ----
  if (/therap|treatment|drug|skipping|ataluren|elevidys|aav/.test(q)) {
    if (!topHyp) return { text: 'No hypothesis to reason from.' };
    const th = topHyp.detail?.chain?.therapeutic;
    return {
      text: `<b>Therapeutic strategy for H${top.id}:</b> ${esc(topHyp.therapeutic || '')}.<br><br>` +
            (th ? `<b>Chain therapy node:</b> <i>${esc(th.label1)}</i> — ${esc(th.label2)}.<br><br>` : '') +
            `<b>Reminder:</b> real prescribing requires variant confirmation, ` +
            `exon-skipping compatibility check, and AAV eligibility screening ` +
            `(anti-capsid NAb titers, T-cell response). ` +
            `This is a mechanism-level pointer, not a clinical recommendation.`,
      hypToOpen: top.id,
    };
  }

  // ---- 10. Phenotype / prognosis ----
  if (/phenotype|prognosis|becker|dmd|bmd|imd|severity|progression|ambulator/.test(q)) {
    return {
      text: `${patientLabel(p)} labeled <b>${p.phenotype}</b>` +
            (p.age ? ` at age <b>${p.age}</b>` : '') +
            (p.ambulatory ? `, <b>${p.ambulatory === 'Yes' ? 'ambulant' : 'non-ambulant'}</b>` : '') +
            `.<br><br>` +
            `<b>Zhang 2024 cohort:</b> DMD ${DATA.phenoBreakdown.DMD || 0}, BMD ${DATA.phenoBreakdown.BMD || 0}, ` +
            `IMD ${DATA.phenoBreakdown.IMD || 0}, pending ${DATA.phenoBreakdown.pending || 0}.<br><br>` +
            `The phenotype label is clinical (age at ambulation loss, muscle biopsy) — Monaco rule holds ~90%, not 100%.`,
    };
  }

  // ---- 11. Variant / genotype ----
  if (/variant|mutation|exon|c\.|p\.|nucleotide|acmg/.test(q)) {
    const v = p.variant;
    return {
      text: `<b>${patientLabel(p)} variant:</b><br>` +
            `• <b>Exon:</b> ${esc(v.exon || '?')} (parsed as ${v.exonNum ?? '?'})<br>` +
            `• <b>Nucleotide (c.):</b> <code>${esc(v.nucleotide || '—')}</code><br>` +
            `• <b>Protein (p.):</b> <code>${esc(v.aaChange || '—')}</code><br>` +
            `• <b>Consequence:</b> ${esc(v.consequence)}<br>` +
            `• <b>ACMG:</b> ${esc(v.acmg || 'not classified')}<br>` +
            `• <b>Source:</b> Zhang 2024, ${esc(p.cohort)} cohort record ${esc(p.cohortPatientId)}`,
    };
  }

  return null;
}

function streamText(text, artifactRef, done) {
  const words = text.split(/(\s+)/);
  let i = 0;
  chatStreaming = true;
  const timer = setInterval(() => {
    // With newest-first stream ordering, target the .streaming turn
    // rather than :last-of-type (which would be the oldest).
    const bubble = document.querySelector('.chat-turn.streaming .chat-turn-body');
    if (!bubble) { clearInterval(timer); chatStreaming = false; return; }
    const partial = words.slice(0, ++i).join('');
    bubble.innerHTML = partial + '<span class="chat-cursor"></span>';
    if (i >= words.length) {
      clearInterval(timer); chatStreaming = false;
      bubble.innerHTML = text;
      done && done();
    }
  }, 20);
}

function ask(query) {
  if (chatStreaming || !query.trim()) return;
  const p = DATA.patients.find(x => x.id === currentPatientId);
  if (!p) return;

  const plan = planChat(query, p) || {
    text: `I don't have a canned answer for "<i>${esc(query)}</i>". Try one of the suggestion chips.`,
  };

  const assistantArtifact = { type: 'chat', role: 'assistant', text: '', streaming: true };

  // PREPEND to top so newest Q&A appears first. Chain (if the plan
  // opened one) sits *below* the assistant turn, so reading top-to-bottom
  // is: user question → agent answer → (optionally) the chain the answer
  // references. Older content pushed further down.
  const newArtifacts = [
    { type: 'chat', role: 'user', text: query },
    assistantArtifact,
  ];
  if (plan.hypToOpen) {
    currentHypId = plan.hypToOpen;
    currentEdgeId = null;
    newArtifacts.push({ type: 'chain', hypId: plan.hypToOpen });
  }
  if (plan.widgetToOpen) {
    newArtifacts.push({ type: 'widget', ...plan.widgetToOpen });
  }
  if (plan.artifactToOpen) {
    // generic artifact push (e.g. nmd_marimekko) — plan supplies {type, ...}
    newArtifacts.push({ ...plan.artifactToOpen });
  }
  rightStream = [...newArtifacts, ...rightStream];

  scrollTopOnRender = true;
  renderPage();
  requestAnimationFrame(() => streamText(plan.text, assistantArtifact, () => {
    assistantArtifact.text = plan.text;
    assistantArtifact.streaming = false;
    renderPage();
  }));
}

// Called on patient change or reset button — seed the stream with just
// the ranked hypothesis artifact.
function seedStream() {
  rightStream = [{ type: 'hyp_rank' }];
  currentHypId = null;
  currentEdgeId = null;
  scrollTopOnRender = false;
}

// ================================================================
// TOP-LEVEL VIEW TABS (Data | Mechanism)
// ================================================================
function renderViewTabs() {
  const tabs = [
    ['data',      'Explore Data',      'chart-first'],
    ['mechanism', 'Explore Mechanism', 'overview · focus · detail'],
    ['lauren',    "Lauren's tab",      'dashboard-style'],
  ];
  return `<div class="pc-viewtabs">
    ${tabs.map(([v, lbl, badge]) => `
      <button class="pc-viewtab ${currentView === v ? 'active' : ''}"
              data-view="${v}">
        ${esc(lbl)} <span class="pc-viewtab-badge">${esc(badge)}</span>
      </button>`).join('')}
  </div>`;
}

// ================================================================
// MAIN RENDER
// ================================================================
function renderPage() {
  const p = DATA.patients.find(x => x.id === currentPatientId) || DATA.patients[0];
  currentPatientId = p.id;

  const bodyCls = overviewMode === 'full'      ? 'overview-full'
                 : overviewMode === 'collapsed' ? 'overview-collapsed' : '';

  const bodyHtml = currentView === 'data'
    ? renderDataView(p)
    : currentView === 'lauren'
    ? renderLaurenView(p)
    : `<div class="pc-body ${bodyCls}">
         ${renderLeftPanel(p)}
         ${renderRightPanel(p)}
       </div>`;

  document.getElementById('app').innerHTML = `
    ${renderTopStrip(p)}
    ${renderViewTabs()}
    ${bodyHtml}
    ${renderOverviewReopen()}
    ${renderEdgeModal(p)}
    ${renderVariantModal()}
  `;

  // Wire top-level view tabs
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      renderPage();
    });
  });

  // Explore Data click handlers only exist when its view is mounted
  if (currentView === 'data') wireDataView(p);

  // Newest artifacts are at the top of the stream, so scroll the
  // right-panel body to the top when new artifacts arrive. Skip on
  // plain re-renders (tile toggles, view mode changes, etc.).
  if (scrollTopOnRender) {
    requestAnimationFrame(() => {
      const body = document.getElementById('right-body');
      if (body) body.scrollTop = 0;
      scrollTopOnRender = false;
    });
  }

  // Initialize any 3Dmol viewers whose <div> just entered the DOM.
  requestAnimationFrame(initPendingEsm3Viewers);

  // ---- wire patient selector (dropdown only — chips row removed) ----
  const picker = document.getElementById('pat-picker');
  if (picker) picker.addEventListener('change', () => {
    currentPatientId = picker.value;
    seedStream();
    renderPage();
  });

  // ---- Overview: tile expand + overview mode ----
  document.querySelectorAll('[data-tile-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.tileToggle;
      if (expandedTiles.has(id)) expandedTiles.delete(id); else expandedTiles.add(id);
      renderPage();
    });
  });
  document.querySelectorAll('[data-ov-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      overviewMode = btn.dataset.ovMode;
      renderPage();
    });
  });
  const ovReopen = document.getElementById('ov-reopen');
  if (ovReopen) ovReopen.addEventListener('click', () => {
    overviewMode = 'normal';
    renderPage();
  });

  // ---- rank row click (Dashboard-style table) → prepend chain artifact ----
  // The hypothesisTable widget emits <tr data-hid="…">; also catch clicks
  // on the compact patient-scoring strip above the table.
  document.querySelectorAll('table.hyp tbody tr[data-hid], .pss-row').forEach(row => {
    row.addEventListener('click', () => {
      const hid = row.dataset.hid;
      if (!hid) return;
      currentHypId = hid; currentEdgeId = null;
      rightStream = [{ type: 'chain', hypId: hid }, ...rightStream];
      scrollTopOnRender = true;
      renderPage();
    });
  });

  // ---- chain view toggle (shared across all chain artifacts) ----
  document.querySelectorAll('[data-chain-view]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      chainView = btn.dataset.chainView; currentEdgeId = null;
      renderPage();
    });
  });

  // ---- regenerate button (stub — would invoke world model) ----
  document.querySelectorAll('[data-regenerate]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const hid = btn.dataset.regenerate;
      alert(`Regenerate H${hid} — stub.\n\nIn production, this would re-invoke HYP-MODEL with the current premise set + patient context, ` +
            `producing a new patient_hypothesis row (with new generator_version and generated_at) alongside the current one. ` +
            `You'd then see the two versions diff in the UI.`);
    });
  });

  // ---- remove any single artifact from the stream ----
  document.querySelectorAll('[data-artifact-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.artifactRemove, 10);
      if (!isNaN(idx) && rightStream[idx]) {
        rightStream.splice(idx, 1);
        renderPage();
      }
    });
  });

  // ---- reset stream button ----
  const resetBtn = document.getElementById('reset-stream');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    seedStream();
    renderPage();
  });

  // ---- chain edges → edge-evidence modal ----
  document.querySelectorAll('[data-edge-id]').forEach(hit => {
    hit.addEventListener('click', (ev) => {
      ev.stopPropagation();
      currentEdgeId = hit.dataset.edgeId;
      renderPage();
    });
  });
  const backdrop = document.getElementById('edge-modal-backdrop');
  if (backdrop) {
    backdrop.addEventListener('click', (ev) => {
      if (ev.target === backdrop) { currentEdgeId = null; renderPage(); }
    });
    const cbtn = document.getElementById('edge-modal-close');
    if (cbtn) cbtn.addEventListener('click', () => { currentEdgeId = null; renderPage(); });
  }

  // ---- variant detail modal (opened from lollipop marker clicks) ----
  document.querySelectorAll('[data-var-modal-close]').forEach(el =>
    el.addEventListener('click', (ev) => {
      // Only close on backdrop click or explicit close btn — not inner clicks
      if (el.classList.contains('pc-var-modal-backdrop') && ev.target !== el) return;
      variantModalId = null;
      renderPage();
    }));
  document.querySelectorAll('[data-var-modal-jump]').forEach(btn =>
    btn.addEventListener('click', () => {
      const pid = btn.dataset.varModalJump;
      if (pid && DATA.patients.some(x => x.id === pid)) {
        currentPatientId = pid;
      }
      variantModalId = null;
      currentView = 'mechanism';
      renderPage();
    }));

  // ---- chat input + suggestion chips + more-panel questions ----
  document.querySelectorAll('.pc-suggest, .pc-cat-item').forEach(b =>
    b.addEventListener('click', () => {
      ask(b.dataset.q);
      if (morePanelOpen) { morePanelOpen = false; renderPage(); }
    }));
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  if (form) form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const q = (input.value || '').trim();
    if (q) { input.value = ''; ask(q); }
  });
  const moreToggle = document.getElementById('more-toggle');
  if (moreToggle) moreToggle.addEventListener('click', () => {
    morePanelOpen = !morePanelOpen; renderPage();
  });
  const moreClose = document.getElementById('more-close');
  if (moreClose) moreClose.addEventListener('click', () => {
    morePanelOpen = false; renderPage();
  });
}

// Drift-detection: on load, log any EXAMPLES question that routes to
// FALLBACK (null from planChat) so we can catch it before the user does.
function driftCheck() {
  if (!DATA || !MECH_DATA) return;
  const p = DATA.patients[0];
  const bad = buildExamples(p).flatMap(c => c.items)
    .filter(i => planChat(i.question, p) === null);
  if (bad.length) {
    console.warn('[patient_chat] questions routing to fallback:', bad.map(b => b.question));
  }
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && currentEdgeId) { currentEdgeId = null; renderPage(); }
});

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [pat, mech] = await Promise.all([
      fetch('patient_data.json', {cache:'no-store'}),
      fetch('mechanism_data.json', {cache:'no-store'}),
    ]);
    if (!pat.ok) throw new Error(`patient_data.json HTTP ${pat.status}`);
    DATA = await pat.json();
    if (mech.ok) MECH_DATA = await mech.json();
    const qp = new URLSearchParams(location.search).get('patient');
    currentPatientId = (qp && DATA.patients.some(x => x.id === qp))
      ? qp : (DATA.featured[0] || DATA.patients[0].id);
    seedStream();
    renderPage();
    driftCheck();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div style="padding:40px;color:var(--bad)">Failed to load: ${esc(e.message)}</div>`;
  }
});
</script>
</body>
</html>
