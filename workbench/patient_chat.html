<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Patient Data</title>
<!--
================================================================
  Patient-scoped generative view — two-panel layout.

    LEFT:  overview (collapsible tiles — patient context)
    RIGHT: generative panel
             · default: prioritized hypothesis rank + question chips
             · click a rank row → chain appears
             · ask a question → new artifact stacks
             · chat input sticky at bottom

  Reuses:
    - patient_data.json + mechanism_data.json
    - widget_palette.js (reasoningChain, edgeEvidenceBar)
    - theme.css

  The left panel has a two-position expand toggle: narrow (35%)
  or wide (55%). When wide, the right panel shrinks; both stay
  visible.
================================================================
-->
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .pc-app { display: flex; flex-direction: column; height: 100vh;
    max-width: 1600px; margin: 0 auto; padding: 12px; gap: 8px; }

  /* --------- top strip: patient selector + identity --------- */
  .pc-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; flex-shrink: 0; }
  .pc-top-pat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; }
  .pc-picker { flex: 1; padding: 6px 10px; border: 1px solid var(--line-2);
    border-radius: 5px; background: white; font-size: 12px; font-family: inherit;
    color: var(--ink); min-width: 260px; max-width: 640px; }

  /* patient details tile (in Overview) --------------------------- */
  .pd-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .pd-uid { font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    font-family: "SF Mono", Menlo, monospace; color: var(--ink); }
  .pd-cohort { font-size: 10px; color: var(--ink-3); }
  .pd-badge { font-size: 10px; padding: 2px 8px; border-radius: 3px;
    font-weight: 700; letter-spacing: 0.02em; }
  .pd-badge.DMD { background: var(--bad-soft); color: var(--bad); }
  .pd-badge.BMD { background: #e6f4ec; color: var(--good); }
  .pd-badge.IMD { background: var(--warn-soft); color: var(--warn); }
  .pd-badge.pending { background: var(--line); color: var(--ink-3); }
  .pd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
  .pd-item { display: flex; flex-direction: column; gap: 2px; }
  .pd-k { color: var(--ink-3); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.05em; }
  .pd-v { color: var(--ink); font-size: 12px; font-weight: 600;
    font-family: "SF Mono", Menlo, monospace; word-break: break-all; }
  .pd-v.plain { font-family: inherit; }
  /* --------- 2-panel body --------- */
  .pc-body { display: grid; gap: 10px; flex: 1; min-height: 0;
    grid-template-columns: 35% 1fr;
    transition: grid-template-columns 0.2s ease; }
  .pc-body.overview-full      { grid-template-columns: 1fr 0px; }
  .pc-body.overview-full  .pc-right { visibility: hidden; }
  .pc-body.overview-collapsed { grid-template-columns: 1fr; gap: 0; }
  .pc-body.overview-collapsed .pc-left { display: none; }
  .pc-ov-reopen { position: fixed; left: 10px; top: 68px; z-index: 100;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 11px;
    color: var(--ink-2); cursor: pointer; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .pc-ov-reopen:hover { border-color: var(--accent); color: var(--accent); }

  .pc-panel { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; }
  .pc-panel-h { display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--bg); flex-shrink: 0; }
  .pc-panel-h-title { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700; }
  .pc-panel-h-sub { font-size: 11px; color: var(--ink-3); margin-left: 6px; }
  .pc-panel-h-actions { margin-left: auto; display: flex; gap: 4px; }
  .pc-panel-btn { background: transparent; border: 1px solid transparent;
    color: var(--ink-3); padding: 3px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 12px; }
  .pc-panel-btn:hover { border-color: var(--line-2); color: var(--ink); }
  .pc-panel-btn.active { background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 600; }
  .pc-panel-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* --------- Overview left panel --------- */
  /* biological-organization group headers (patient → variant → gene →
     protein → pathway → cell type → tissue type → phenotype) */
  .ov-group-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700;
    padding: 8px 0 4px 4px; margin-top: 6px;
    border-bottom: 1px solid var(--line-2); }
  .ov-group-h:first-child { margin-top: 0; padding-top: 0; }
  .ov-group-h .ov-group-h-num { margin-right: 6px; color: var(--ink-3);
    font-weight: 700; opacity: 0.5; }
  .ov-group { margin-bottom: 4px; }

  .ov-tile { background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .ov-tile-toggle { width: 100%; background: transparent; border: none;
    padding: 10px 12px; font: inherit; text-align: left; display: flex;
    align-items: center; gap: 8px; cursor: pointer; color: var(--ink); }
  .ov-tile-toggle:hover { background: var(--panel); }
  .ov-tile-h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-2); font-weight: 700; }
  .ov-tile-summary { flex: 1; text-align: right; font-size: 10px; color: var(--ink-3); }
  .ov-tile-summary b { color: var(--ink-2); font-weight: 700; }
  .ov-tile-summary .warn { color: var(--bad); font-weight: 700; }
  .ov-tile-chevron { color: var(--ink-3); font-size: 10px; flex-shrink: 0; }
  .ov-tile-body { padding: 8px 12px 12px; border-top: 1px solid var(--line);
    background: var(--panel); }
  .ov-tile-body .foot { color: var(--ink-3); font-size: 10px; margin-top: 6px; }

  /* labs table */
  .ov-labs-group { margin-bottom: 8px; }
  .ov-labs-group-h { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); font-weight: 700; margin: 4px 0 3px 0;
    padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .ov-lab-row { display: grid; grid-template-columns: 1fr auto auto;
    gap: 8px; align-items: baseline; font-size: 11px; padding: 3px 0; }
  .ov-lab-lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .ov-lab-val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ov-lab-flag { font-size: 9px; text-transform: uppercase; padding: 0 5px;
    border-radius: 3px; font-weight: 700; }
  .ov-lab-flag.normal { color: var(--ink-3); background: var(--line); }
  .ov-lab-flag.low    { color: var(--warn); background: var(--warn-soft); }
  .ov-lab-flag.high   { color: var(--bad);  background: var(--bad-soft); }

  /* iso / cell rows (compact) */
  .ov-iso-row { display: grid; grid-template-columns: 60px 1fr 50px; gap: 8px;
    align-items: center; margin-bottom: 4px; font-size: 11px; }
  .ov-iso-lbl { color: var(--ink-2); font-family: "SF Mono", Menlo, monospace;
    font-size: 10px; font-weight: 600; }
  .ov-iso-track { height: 10px; background: var(--line); border-radius: 3px; }
  .ov-iso-fill { height: 100%; border-radius: 3px; }
  .ov-iso-fill.hit    { background: var(--bad); }
  .ov-iso-fill.spared { background: var(--good); }
  .ov-iso-tag { font-size: 9px; font-weight: 700; text-align: right;
    text-transform: uppercase; }
  .ov-iso-tag.hit    { color: var(--bad); }
  .ov-iso-tag.spared { color: var(--good); }

  .ov-cell-row { display: grid; grid-template-columns: 1fr 55px; gap: 8px;
    align-items: center; margin-bottom: 4px; font-size: 11px; }
  .ov-cell-lbl { color: var(--ink-2); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ov-cell-track { height: 8px; background: var(--line); border-radius: 3px;
    margin-top: 2px; }
  .ov-cell-fill { height: 100%; border-radius: 3px; }
  .ov-cell-fill.hit     { background: var(--bad); }
  .ov-cell-fill.partial { background: var(--warn); }
  .ov-cell-fill.spared  { background: var(--good); }
  .ov-cell-status { font-size: 9px; font-weight: 700; text-align: right;
    text-transform: uppercase; }
  .ov-cell-status.hit     { color: var(--bad); }
  .ov-cell-status.partial { color: var(--warn); }
  .ov-cell-status.spared  { color: var(--good); }

  .ov-tis-group { margin-bottom: 8px; }
  .ov-tis-group-h { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    font-weight: 700; margin-bottom: 4px; }
  .ov-tis-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .ov-tis-chip { padding: 2px 7px; border-radius: 3px; font-size: 10px;
    font-family: "SF Mono", Menlo, monospace; }
  .ov-tis-chip.hit    { background: var(--bad-soft);  color: var(--bad); }
  .ov-tis-chip.spared { background: var(--good-soft); color: var(--good); }

  .ov-pw-row { display: grid; grid-template-columns: 1fr 40px; align-items: center;
    gap: 8px; font-size: 11px; margin-bottom: 4px; }
  .ov-pw-lbl { color: var(--ink-2); font-size: 10px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ov-pw-track { height: 6px; background: var(--line); border-radius: 3px;
    margin-top: 3px; }
  .ov-pw-fill { height: 100%; background: var(--good); border-radius: 3px; }
  .ov-pw-val { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums;
    font-size: 10px; }

  /* exon SVG (compact) */
  .ov-exon-svg { width: 100%; display: block; }

  /* --------- Right panel: generative --------- */
  .gen-artifact { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .gen-artifact:last-child { border-bottom: none; }
  .gen-artifact-h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; }
  .gen-artifact-badge { background: var(--accent); color: white; padding: 1px 6px;
    border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.04em; }
  .gen-artifact-h .close { margin-left: auto; background: transparent;
    border: 1px solid transparent; padding: 2px 8px; border-radius: 4px;
    cursor: pointer; color: var(--ink-3); font-family: inherit; font-size: 14px;
    line-height: 1; }
  .gen-artifact-h .close:hover { border-color: var(--line-2); color: var(--ink); }

  /* World-model provenance + trace layer --------------------------- */
  .gen-provenance { display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: 6px;
    margin-bottom: 10px; font-size: 11px; color: var(--ink-2); }
  .gen-provenance-badge { background: var(--accent); color: white;
    padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; }
  .gen-provenance b { color: var(--ink); font-weight: 600; }
  .gen-provenance .gen-provenance-sep { color: var(--ink-3); margin: 0 4px; }
  .gen-regenerate { margin-left: auto; background: white;
    border: 1px solid var(--accent); color: var(--accent);
    padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .gen-regenerate:hover { background: var(--accent); color: white; }

  .premises-drawer { margin: 10px 0; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); }
  .premises-drawer-h { padding: 8px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
  .premises-drawer-h b { color: var(--ink); }
  .premise-row { display: grid; grid-template-columns: 130px 42px 1fr;
    gap: 8px; align-items: baseline; padding: 6px 12px; font-size: 11px;
    border-bottom: 1px solid var(--line); }
  .premise-row:last-child { border-bottom: none; }
  .premise-source { font-family: "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--ink-2); background: var(--panel); padding: 2px 6px;
    border-radius: 3px; text-align: center; border: 1px solid var(--line-2); }
  .premise-weight { font-variant-numeric: tabular-nums; font-weight: 700;
    text-align: right; font-size: 10px; }
  .premise-weight.pos { color: var(--good); }
  .premise-weight.neg { color: var(--bad); }
  .premise-rationale { color: var(--ink-2); line-height: 1.4; }

  .therapies-panel { margin: 10px 0; padding: 10px 12px;
    background: var(--good-soft); border: 1px solid var(--good);
    border-radius: 8px; }
  .therapies-panel-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--good); font-weight: 700;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .therapies-panel-h b { color: var(--ink); }
  .therapy-card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .therapy-card:last-child { margin-bottom: 0; }
  .therapy-card-head { display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px; }
  .therapy-modality { background: var(--good); color: white;
    padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; }
  .therapy-modality.ASO           { background: var(--sky); }
  .therapy-modality.small_molecule{ background: var(--violet); }
  .therapy-modality.readthrough   { background: var(--warn); }
  .therapy-design { font-family: "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--ink-3); flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .therapy-eligibility { font-size: 9px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; font-weight: 700; }
  .therapy-eligibility.eligible            { background: var(--good-soft); color: var(--good); }
  .therapy-eligibility.excluded            { background: var(--bad-soft);  color: var(--bad); }
  .therapy-eligibility.screening_required  { background: var(--warn-soft); color: var(--warn); }
  .therapy-eligibility.unknown             { background: var(--line);      color: var(--ink-3); }
  .therapy-rationale { color: var(--ink-2); font-size: 11px; line-height: 1.4; }

  .pss-provenance { font-size: 9px; color: var(--ink-3);
    margin-left: 4px; font-family: "SF Mono", Menlo, monospace; }

  /* Score vector strip — shows the multi-dimensional ranking */
  .score-vector { display: flex; gap: 10px; align-items: center;
    padding: 8px 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: 10px; font-size: 11px; }
  .sv-metric { display: flex; flex-direction: column; gap: 2px; align-items: center;
    min-width: 60px; }
  .sv-metric-label { font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700; }
  .sv-metric-value { font-size: 14px; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .sv-metric-bar { height: 4px; width: 60px; background: var(--line);
    border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .sv-metric-fill { height: 100%; background: var(--good); }
  .sv-hint { color: var(--ink-3); font-size: 10px; font-style: italic;
    margin-left: auto; }
  .sv-metric-fill.warn { background: var(--warn); }
  .sv-metric-fill.bad  { background: var(--bad); }

  /* Refined-claim panel — Layer 1 deterministic + Layer 2 LLM narrative */
  .refined-claim { margin: 10px 0; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; }
  .refined-claim-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .refined-claim-h .layer-badge { background: var(--accent-soft);
    color: var(--accent); padding: 1px 6px; border-radius: 3px;
    font-size: 9px; }
  .refined-claim-h .model-tag { color: var(--ink-3);
    font-family: "SF Mono", Menlo, monospace; margin-left: auto;
    font-weight: 500; text-transform: none; letter-spacing: 0; }
  .refined-narrative { font-size: 13px; line-height: 1.55; color: var(--ink);
    margin-bottom: 8px; }
  .refined-details { display: flex; flex-direction: column; gap: 6px;
    margin-top: 8px; }
  .refined-section { border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); overflow: hidden; }
  .refined-section summary { padding: 6px 10px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2);
    font-weight: 700; cursor: pointer; user-select: none; }
  .refined-section[open] summary { border-bottom: 1px solid var(--line); }
  .refined-section-body { padding: 8px 10px; font-size: 12px;
    color: var(--ink-2); line-height: 1.5; }
  .refined-section-body ul { margin: 0; padding-left: 20px; }
  .refined-section-body li { margin-bottom: 4px; }
  .cbd-item { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .cbd-item:last-child { border-bottom: none; }
  .cbd-item .other-id { font-weight: 700; color: var(--ink);
    font-family: "SF Mono", Menlo, monospace; margin-right: 6px; }

  /* Contradictions panel — shown under the score vector when consistency < 1 */
  .contradictions-panel { margin: 10px 0; padding: 10px 12px;
    background: var(--warn-soft); border: 1px solid var(--warn);
    border-radius: 8px; }
  .contradictions-panel-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--warn); font-weight: 700;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .contradictions-panel-h b { color: var(--ink); }
  .contra-card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .contra-card:last-child { margin-bottom: 0; }
  .contra-card-head { display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; font-size: 11px; color: var(--ink-2); }
  .contra-position { font-family: "SF Mono", Menlo, monospace;
    color: var(--ink); font-weight: 700;
    background: var(--bg); padding: 2px 6px; border-radius: 3px; }
  .contra-signs { font-family: "SF Mono", Menlo, monospace; font-size: 10px; }
  .contra-signs .pos { color: var(--good); }
  .contra-signs .neg { color: var(--bad); }
  .contra-row { display: flex; align-items: flex-start; gap: 6px;
    font-size: 11px; line-height: 1.4; margin-bottom: 3px; }
  .contra-row .marker { font-weight: 700; min-width: 44px; text-align: right;
    font-family: "SF Mono", Menlo, monospace; }
  .contra-row.pos .marker { color: var(--good); }
  .contra-row.neg .marker { color: var(--bad); }
  .contra-row .rationale { color: var(--ink-2); flex: 1; }

  /* Evidence badge on each layered-chain box */
  .lc-evidence-badge { display: inline-block; margin-left: 6px;
    padding: 1px 6px; font-size: 9px; font-family: "SF Mono", Menlo, monospace;
    color: var(--good); background: var(--good-soft); border-radius: 3px;
    font-weight: 700; vertical-align: middle; }
  .lc-evidence-badge.empty { color: var(--ink-3); background: var(--line); }

  /* Edge label showing premise count / weight */
  .lc-edge-label { font-size: 9px; color: var(--good); font-weight: 700;
    font-family: "SF Mono", Menlo, monospace; margin-left: 4px;
    padding: 1px 5px; background: var(--good-soft); border-radius: 3px; }

  /* ESM3 3D structure artifact ------------------------------------- */
  .esm3-wrap { padding: 6px 0; }
  .esm3-lede { font-size: 12px; color: var(--ink-2); line-height: 1.5;
    padding: 8px 12px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--accent); margin-bottom: 10px; }
  .esm3-meta { display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 11px; color: var(--ink-3); margin: 6px 0 10px; }
  .esm3-meta b { color: var(--ink-2); }
  .esm3-viewer { position: relative; width: 100%; height: 360px;
    background: #1a2233; border-radius: 8px; overflow: hidden; }
  .esm3-viewer canvas { display: block; }
  .esm3-grid { display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin: 8px 0; }
  .esm3-panel { display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 8px; padding: 8px; }
  .esm3-panel-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-2); font-weight: 700; }
  .esm3-panel-h-sub { text-transform: none; letter-spacing: 0;
    color: var(--ink-3); font-weight: 500; margin-left: 6px; font-size: 10px; }
  .esm3-panel-meta { font-size: 10px; color: var(--ink-3); text-align: center; }
  .esm3-panel-meta b { color: var(--ink-2); }
  .esm3-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px;
    font-size: 11px; color: var(--ink-2); }

<body>

<div class="pc-app" id="app"><!-- rendered by renderPage() --></div>

<script src="widget_palette.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.0/3Dmol-min.js"></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let DATA = null;
let MECH_DATA = null;
let currentPatientId = null;
let currentHypId = null;         // selected hypothesis → chain visible in right panel
let currentEdgeId = null;        // selected chain edge → modal open
let chatStreaming = false;
let expandedTiles = new Set();   // default: all Overview tiles collapsed
let overviewMode = 'normal';     // 'normal' | 'wide' | 'full' | 'collapsed'
let morePanelOpen = false;       // "See more example questions" panel — default closed
let chainView = 'flow';          // 'flow' | 'layers'
let rightStream = [];            // artifact stream — NEWEST FIRST (prepended)
let scrollTopOnRender = false;   // scroll right-panel body to top when new artifact arrives

const patientLabel = (p) => `Patient ${p.seqNum}`;

// ---- biological layers dictionary (curated per hypothesis) --------
const LAYERS = [
  ['variant','Variant'], ['protein','Protein'], ['pathway','Pathway'],
  ['subcellular','Subcellular loc.'], ['cellType','Cell type'],
  ['tissueType','Tissue type'], ['phenotype','Phenotype'],
];
const HYPOTHESIS_LAYERS = {
  '01': {
    variant:{title:'Out-of-frame deletion', meta:'e.g. Δexon 45; frameshift → PTC'},
    protein:{title:'Truncated dystrophin (or absent)', meta:'no C-terminal DGC anchor'},
    pathway:{title:'Ca²⁺ / calpain signaling cascade', meta:'activated by contraction stress'},
    subcellular:{title:'Sarcolemma decouples from ECM', meta:'DGC disassembly · membrane micro-tears'},
    cellType:{title:'Myofiber necrosis', meta:'CK release · satellite exhaustion'},
    tissueType:{title:'Skeletal + cardiac muscle', meta:'fibro-fatty replacement'},
    phenotype:{title:'DMD (Duchenne)', meta:'wheelchair ~10–12 y · cardiomyopathy'},
    therapy:{title:'Exon-skipping ASO · µ-dystrophin AAV', meta:'restores in-frame Dp427m'},
  },
  '02': {
    variant:{title:'In-frame central-rod deletion', meta:'e.g. Δexons 45–47; ≡0 mod 3'},
    protein:{title:'Shortened but functional dystrophin', meta:'N-terminal + DGC preserved'},
    pathway:{title:'Attenuated Ca²⁺ / calpain leak', meta:'gradual, not acute'},
    subcellular:{title:'Partial DGC assembly at sarcolemma', meta:'membrane anchored, weaker'},
    cellType:{title:'Slow myofiber loss', meta:'regeneration keeps pace longer'},
    tissueType:{title:'Skeletal + cardiac muscle', meta:'milder cardiac course'},
    phenotype:{title:'BMD (Becker)', meta:'ambulation to 30–40 y · late onset'},
    therapy:{title:'Utrophin upreg · exon-skip → in-frame', meta:'convert DMD → BMD state'},
  },
  '03': {
    variant:{title:'Nonsense or canonical splice-site', meta:'creates PTC in mRNA'},
    protein:{title:'NMD-mediated transcript loss', meta:'protein absent (<5% WT)'},
    pathway:{title:'Ca²⁺ / calpain cascade', meta:'downstream identical to H01'},
    subcellular:{title:'Sarcolemmal DGC loss', meta:'tissue-graded NMD escape'},
    cellType:{title:'Myofiber necrosis', meta:'brain/cardiac partial isoform rescue'},
    tissueType:{title:'Muscle > brain > cardiac', meta:'graded severity by NMD efficiency'},
    phenotype:{title:'DMD, milder if PTC escape', meta:'ataluren-eligible subset'},
    therapy:{title:'Ataluren readthrough · NMD inhibitors', meta:'restore partial protein from PTC mRNA'},
  },
  '04': {
    variant:{title:"Distal 5′ variant (exon ≥45)", meta:'or internal promoter (Dp140/Dp71)'},
    protein:{title:'Dp140 / Dp116 / Dp71 ablated', meta:'Dp427m preserved in muscle'},
    pathway:{title:'Isoform-scoped signaling loss', meta:'podocyte · glial · retinal'},
    subcellular:{title:'Dystrophin lost at synapse · podocyte foot process', meta:'muscle DGC intact'},
    cellType:{title:'Cortical astrocytes · rod/cone · podocytes', meta:'myofibers preserved'},
    tissueType:{title:'CNS + retina + kidney', meta:'skeletal muscle spared'},
    phenotype:{title:'Cognitive deficits · ERG anomalies · proteinuria risk', meta:'motor function preserved'},
    therapy:{title:'Isoform-selective AAV (Dp140 / Dp71)', meta:'tissue-restricted promoter'},
  },
};

// ================================================================
// LEFT PANEL — Overview
// ================================================================
const LAB_GROUPS = [
  { layer:'cellType',   label:'Cell type · myofibers' },
  { layer:'tissueType', label:'Tissue', tissue:'skeletal',    tissueLbl:'skeletal muscle' },
  { layer:'tissueType', label:'Tissue', tissue:'cardiac',     tissueLbl:'cardiac' },
  { layer:'tissueType', label:'Tissue', tissue:'respiratory', tissueLbl:'respiratory' },
  { layer:'tissueType', label:'Tissue', tissue:'CNS',         tissueLbl:'CNS (H04)' },
  { layer:'tissueType', label:'Tissue', tissue:'retina',      tissueLbl:'retina (H04)' },
  { layer:'tissueType', label:'Tissue', tissue:'kidney',      tissueLbl:'kidney (H04)' },
  { layer:'phenotype',  label:'Phenotype · motor function' },
];

function fmtLabVal(l) {
  if (l.unit === 'presence') return l.value ? 'present' : 'absent';
  if (l.value >= 1000) return Number(l.value).toLocaleString('en-US');
  return String(l.value);
}

function wrapTile(id, title, summary, body) {
  const open = expandedTiles.has(id);
  return `
    <div class="ov-tile ${open ? 'expanded' : 'collapsed'}">
      <button class="ov-tile-toggle" data-tile-toggle="${esc(id)}">
        <span class="ov-tile-h">${esc(title)}</span>
        <span class="ov-tile-summary">${summary || ''}</span>
        <span class="ov-tile-chevron">${open ? '▾' : '▸'}</span>
      </button>
      ${open ? `<div class="ov-tile-body">${body}</div>` : ''}
    </div>`;
}

function renderExonSvg(p) {
  const nExons = DATA.gene.nExons;
  const isoforms = DATA.isoforms;
  const W = 320, pad = 8;
  const trackY = 14, trackH = 8;
  const laneY0 = trackY + trackH + 6;
  const laneH = 4, laneGap = 2;
  const totalH = laneY0 + isoforms.length * (laneH + laneGap) + 12;
  const xForExon = (e) => pad + ((e - 1) / (nExons - 1)) * (W - 2 * pad);
  const lanes = isoforms.map((iso, i) => {
    const impact = p.isoformImpact.find(x => x.id === iso.id);
    const hit = impact && impact.hit;
    const x1 = xForExon(iso.firstSharedExon);
    const x2 = xForExon(nExons);
    const y  = laneY0 + i * (laneH + laneGap);
    return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="${laneH}"
              fill="${hit ? 'var(--bad)' : 'var(--good)'}" opacity="0.85"/>
            <text x="${x1 - 3}" y="${y + laneH - 0.5}" text-anchor="end"
                  font-size="7.5" font-family="SF Mono, Menlo, monospace"
                  fill="var(--ink-3)">${esc(iso.id)}</text>`;
  }).join('');
  const vE = p.variant.exonNum;
  let mark = '';
  if (vE) {
    const vx = xForExon(vE);
    mark = `<line x1="${vx}" y1="${trackY - 3}" x2="${vx}" y2="${laneY0 + isoforms.length * (laneH + laneGap)}"
              stroke="var(--bad)" stroke-width="1" stroke-dasharray="1.5 1.5"/>
            <circle cx="${vx}" cy="${trackY - 5}" r="3" fill="var(--bad)" stroke="white" stroke-width="0.8"/>`;
  }
  return `<svg class="ov-exon-svg" viewBox="0 0 ${W} ${totalH}" preserveAspectRatio="xMidYMid meet">
    <rect x="${pad}" y="${trackY}" width="${W - 2 * pad}" height="${trackH}"
          fill="var(--line)" stroke="var(--line-2)"/>
    <text x="${pad}" y="${totalH - 1}" font-size="8" fill="var(--ink-3)">exon 1</text>
    <text x="${W - pad}" y="${totalH - 1}" text-anchor="end" font-size="8" fill="var(--ink-3)">${nExons}</text>
    <text x="${W/2}" y="${totalH - 1}" text-anchor="middle" font-size="8" fill="var(--ink-3)">
      variant at exon ${esc(String(vE || '?'))}
    </text>
    ${lanes}${mark}
  </svg>`;
}

function renderOverview(p) {
  const hitN = p.isoformImpact.filter(i => i.hit).length;
  const totN = p.isoformImpact.length;
  const cellHit = p.cellTypeImpact.filter(c => c.status === 'hit').length;
  const abn = p.labs.filter(l => l.flag !== 'normal').length;

  // -- patient details tile (first in Overview)
  const v = p.variant;
  const age = p.age ? `${p.age} yr` : '—';
  const amb = p.ambulatory || '—';
  const pdBody = `
    <div class="pd-head">
      <span class="pd-uid">${esc(patientLabel(p))}</span>
      <span class="pd-badge ${esc(p.phenotype)}">${esc(p.phenotype)}</span>
      <span class="pd-cohort">${esc(p.cohort)} #${esc(p.cohortPatientId)}</span>
    </div>
    <div class="pd-grid">
      <div class="pd-item"><span class="pd-k">Age</span>
        <span class="pd-v plain">${esc(age)}</span></div>
      <div class="pd-item"><span class="pd-k">Ambulatory</span>
        <span class="pd-v plain">${esc(amb)}</span></div>
      <div class="pd-item"><span class="pd-k">Exon</span>
        <span class="pd-v plain">${esc(v.exon || '—')}</span></div>
      <div class="pd-item"><span class="pd-k">Consequence</span>
        <span class="pd-v plain">${esc(v.consequence || '—')}</span></div>
      <div class="pd-item"><span class="pd-k">Nucleotide (c.)</span>
        <span class="pd-v">${esc(v.nucleotide || '—')}</span></div>
      <div class="pd-item"><span class="pd-k">Protein (p.)</span>
        <span class="pd-v">${esc(v.aaChange || '—')}</span></div>
      <div class="pd-item"><span class="pd-k">ACMG</span>
        <span class="pd-v plain">${esc(v.acmg || '—')}</span></div>
      <div class="pd-item"><span class="pd-k">Source</span>
        <span class="pd-v plain" style="font-size:11px">Zhang 2024</span></div>
    </div>`;
  const pdSummary = `<span class="pd-badge ${esc(p.phenotype)}" style="margin-right:4px">${esc(p.phenotype)}</span>` +
    `<span>${p.age ? p.age + 'y' : '—'} · exon ${esc(v.exon || '?')} · ${esc(v.consequence || '—')}</span>`;
  const patientTile = wrapTile('patient', 'Patient Details', pdSummary, pdBody);

  // -- exon tile
  const exonTile = wrapTile('exon', 'Variant × Isoform Coverage',
    `<span>exon <b>${esc(String(p.variant.exonNum || '?'))}</b> · <b>${hitN}</b>/<b>${totN}</b> iso hit</span>`,
    renderExonSvg(p));

  // -- labs tile
  const labGroups = LAB_GROUPS.map(g => {
    const rows = p.labs.filter(l => l.layer === g.layer && (!g.tissue || l.tissue === g.tissue));
    if (!rows.length) return '';
    const label = g.tissueLbl ? `Tissue · ${g.tissueLbl}` : g.label;
    const rowHtml = rows.map(l => `
      <div class="ov-lab-row" title="${esc(l.label)} · ref ${l.refLow}-${l.refHigh} ${esc(l.unit)}">
        <span class="ov-lab-lbl">${esc(l.label)}</span>
        <span class="ov-lab-val">${esc(fmtLabVal(l))}${l.unit && l.unit !== 'presence' ? ' ' + esc(l.unit === '% predicted' ? '%' : l.unit) : ''}</span>
        <span class="ov-lab-flag ${esc(l.flag)}">${esc(l.flag)}</span>
      </div>`).join('');
    return `<div class="ov-labs-group">
      <div class="ov-labs-group-h">${esc(label)}</div>${rowHtml}</div>`;
  }).join('');
  const labsTile = wrapTile('labs', 'Clinical Labs',
    `<span><span class="warn">${abn}</span>/<b>${p.labs.length}</b> abnormal</span>`,
    labGroups);

  // -- iso tile
  const isoRows = p.isoformImpact.map(iso => {
    const cls = iso.hit ? 'hit' : 'spared';
    return `<div class="ov-iso-row">
      <span class="ov-iso-lbl">${esc(iso.id)}</span>
      <div class="ov-iso-track"><div class="ov-iso-fill ${cls}" style="width:100%"></div></div>
      <span class="ov-iso-tag ${cls}">${cls}</span>
    </div>`;
  }).join('');
  const isoTile = wrapTile('iso', 'Isoform Impact',
    `<b>${hitN}</b>/<b>${totN}</b> hit`, isoRows);

  // -- cell tile
  const maxSc = Math.max(...p.cellTypeImpact.map(c => c.score), 1);
  const cellRows = p.cellTypeImpact.map(c => {
    const pct = Math.round((c.score / maxSc) * 100);
    return `<div class="ov-cell-row" title="${esc(c.reason)}">
      <div>
        <div class="ov-cell-lbl">${esc(c.name)}</div>
        <div class="ov-cell-track"><div class="ov-cell-fill ${esc(c.status)}" style="width:${pct}%"></div></div>
      </div>
      <span class="ov-cell-status ${esc(c.status)}">${esc(c.status)}</span>
    </div>`;
  }).join('');
  const cellTile = wrapTile('cell', 'Cell Types Affected',
    `<b>${cellHit}</b>/<b>${p.cellTypeImpact.length}</b> hit`, cellRows);

  // -- tissue tile
  const tisChips = (arr, cls) => arr.map(t => `<span class="ov-tis-chip ${cls}">${esc(t)}</span>`).join('')
      || `<span style="color:var(--ink-3);font-size:10px">none</span>`;
  const tisBody = `
    <div class="ov-tis-group">
      <div class="ov-tis-group-h" style="color:var(--bad)">Hit (${p.tissuesHit.length})</div>
      <div class="ov-tis-chips">${tisChips(p.tissuesHit, 'hit')}</div>
    </div>
    <div class="ov-tis-group">
      <div class="ov-tis-group-h" style="color:var(--good)">Spared (${p.tissuesSpared.length})</div>
      <div class="ov-tis-chips">${tisChips(p.tissuesSpared, 'spared')}</div>
    </div>`;
  const tisTile = wrapTile('tis', 'Tissues Affected',
    `<span class="warn">${p.tissuesHit.length}</span> hit · <b>${p.tissuesSpared.length}</b> spared`,
    tisBody);

  // -- pathway tile
  let pwBody = '<div style="color:var(--ink-3);font-size:10px">pathway data unavailable</div>';
  let pwSummary = '';
  if (MECH_DATA) {
    const rows = (MECH_DATA.tiles?.pathways?.rows || []).slice(0, 5);
    const maxV = MECH_DATA.tiles?.pathways?.max || 10;
    pwBody = rows.map(r => {
      const pct = Math.round((r.value / maxV) * 100);
      return `<div class="ov-pw-row">
        <div>
          <div class="ov-pw-lbl" title="${esc(r.label)}">${esc(r.label)}</div>
          <div class="ov-pw-track"><div class="ov-pw-fill" style="width:${pct}%"></div></div>
        </div>
        <span class="ov-pw-val">${r.value.toFixed(1)}</span>
      </div>`;
    }).join('');
    pwSummary = `<b>${rows.length}</b> pathways`;
  }
  const pwTile = wrapTile('pw', 'Pathway Implications', pwSummary, pwBody);

  // -- gene metadata tile (small, static from DATA.gene)
  const g = DATA.gene;
  const geneBody = `
    <div class="pd-grid">
      <div class="pd-item"><span class="pd-k">Symbol</span>
        <span class="pd-v">${esc(g.symbol)}</span></div>
      <div class="pd-item"><span class="pd-k">UniProt</span>
        <span class="pd-v">${esc(g.uniprot)}</span></div>
      <div class="pd-item"><span class="pd-k">Locus</span>
        <span class="pd-v plain">${esc(g.locus)} · ${g.locusSizeMb} Mb</span></div>
      <div class="pd-item"><span class="pd-k">Exons</span>
        <span class="pd-v plain">${g.nExons}</span></div>
      <div class="pd-item" style="grid-column: 1 / -1;"><span class="pd-k">Isoforms (${g.isoformNames.length})</span>
        <span class="pd-v plain">${esc(g.isoformNames.join(' · '))}</span></div>
    </div>`;
  const geneTile = wrapTile('gene', 'Gene', `<b>${esc(g.symbol)}</b> · ${g.nExons} exons · ${g.isoformNames.length} isoforms`, geneBody);

  // -- gene-level cohort tiles from mechanism_data.json (widget palette)
  //    These match the Dashboard's Mechanistic Overview section.
  let genEvTile = '', phenTile = '';
  if (MECH_DATA && window.WIDGETS) {
    const gt = MECH_DATA.tiles?.geneticEvidence;
    if (gt) {
      const bd = gt.breakdown.map(s => `${s.label} ${s.pct}%`).join(' · ');
      const gtBody = window.WIDGETS.stackedBar.render({title: 'Genetic Evidence', ...gt});
      genEvTile = wrapTile('gene_ev', 'Cohort: Genetic Evidence',
        `<b>${gt.big}</b> · ${esc(bd)}`, gtBody);
    }
    const pd = MECH_DATA.tiles?.phenotypeDist;
    if (pd) {
      const pdSum = `<b>${pd.center?.value || ''}</b> ${esc(pd.center?.label || '')}`;
      const pdBody2 = window.WIDGETS.donutBreakdown.render({title: 'Phenotype Distribution', ...pd});
      phenTile = wrapTile('pheno_dist', 'Cohort: Phenotype Distribution', pdSum, pdBody2);
    }
  }

  // -- assemble by biological organization ----------------------------
  // Each group: [label, tiles]. Grouping matches the layered biological
  // view (variant → gene → protein → pathway → cell → tissue → phenotype)
  // preceded by the patient card.
  const groups = [
    { n: '1', label: 'Patient',      tiles: [patientTile, labsTile] },
    { n: '2', label: 'Variant',      tiles: [exonTile, genEvTile] },
    { n: '3', label: 'Gene',         tiles: [geneTile] },
    { n: '4', label: 'Protein',      tiles: [isoTile] },
    { n: '5', label: 'Pathway',      tiles: [pwTile] },
    { n: '6', label: 'Cell type',    tiles: [cellTile] },
    { n: '7', label: 'Tissue type',  tiles: [tisTile] },
    { n: '8', label: 'Phenotype',    tiles: [phenTile] },
  ];

  return groups.map(g => `
    <div class="ov-group-h">
      <span class="ov-group-h-num">${g.n}</span>${esc(g.label)}
    </div>
    <div class="ov-group">${g.tiles.filter(Boolean).join('')}</div>
  `).join('');
}

// ================================================================
// RIGHT PANEL — generative artifacts
// ================================================================
// Uses the SAME hypothesisTable widget as the Dashboard for consistency.
// Patient-specific overlay: (a) the "selected" row is currentHypId (or
// the patient's top-ranked hypothesis by default), (b) a small strip
// above the table shows this patient's ranking + fit reasons + lab
// bullet counts so the patient-scoped scoring is still visible.
function renderHypRankArtifact(p) {
  if (!MECH_DATA?.hypotheses || !window.WIDGETS) return '';
  const ranking = p.hypothesisRanking || [];
  const topId = ranking[0]?.id;
  const selectedId = currentHypId || topId;
  const patientRankById = Object.fromEntries(ranking.map(r => [r.id, r]));

  // Reorder rows by this patient's ranking (top-scored first) and
  // annotate each with .selected for the widget's row-highlighting.
  const rowsInPatientOrder = ranking.map(r => {
    const h = MECH_DATA.hypotheses.find(x => x.id === r.id);
    return h ? { ...h, selected: h.id === selectedId } : null;
  }).filter(Boolean);

  const table = window.WIDGETS.hypothesisTable.render({
    rows: rowsInPatientOrder,
    meta: MECH_DATA.hypothesesMeta,
  });

  // Compact patient-scoring strip above the table.
  const patientStrip = `
    <div class="pat-scoring-strip">
      <div class="pss-h">Patient-specific ranking for ${esc(patientLabel(p))}
        <span class="pss-sub">
          (score from variant × phenotype × exon position · lab bullets from this patient's data)
        </span>
      </div>
      <div class="pss-rows">
        ${ranking.map(r => {
          const nPrem = (r.premises || []).length;
          const nTh   = (r.therapeutics || []).length;
          const genVer = r.generator?.version || '';
          return `
          <div class="pss-row ${r.id === selectedId ? 'sel' : ''}" data-hid="${esc(r.id)}">
            <span class="pss-rank">#${r.rank}</span>
            <span class="pss-hid">H${esc(r.id)}</span>
            <span class="pss-score">${r.score.toFixed(1)}</span>
            <span class="pss-fit">${esc(r.fit)}</span>
            <span class="pss-pe">
              ${nPrem ? `<b>${nPrem}</b> premises` : ''}
              ${nTh ? ` · <b>${nTh}</b> therap${nTh === 1 ? 'y' : 'ies'}` : ''}
              ${genVer ? `<span class="pss-provenance">${esc(genVer)}</span>` : ''}
            </span>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  return `<div class="gen-artifact">
    <div class="gen-artifact-h">
      <span class="gen-artifact-badge">HYP-MODEL</span>
      Prioritized hypotheses for ${esc(patientLabel(p))}
      <span style="color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0">
        · click a row to see the chain
      </span>
    </div>
    ${patientStrip}
    ${table}
  </div>`;
}

function renderLayeredChain(hypId, storedHyp) {
  const L = HYPOTHESIS_LAYERS[hypId];
  if (!L) return `<div style="color:var(--ink-3);font-size:11px;padding:8px">
    No layered mapping curated for H${esc(hypId)}.</div>`;

  // Pull per-layer + per-edge premise counts + weights from stored chain links
  const layerCounts = storedHyp?.scoreVector?.layerScores || {};
  const edgeCounts  = storedHyp?.scoreVector?.edgeScores || {};
  const nodeChain   = storedHyp?.chainLinks?.nodes || {};
  const edgeChain   = storedHyp?.chainLinks?.edges || {};

  // Colour by evidence weight — 0 = neutral, higher = greener.
  const bgFromWeight = (w) => {
    if (!w || w <= 0)     return null;   // no evidence — use default layer bg
    if (w < 0.5)          return '#f4f7ec';
    if (w < 1.0)          return '#e6f0d8';
    if (w < 1.5)          return '#d4e6bf';
    return '#c1dda5';
  };

  const rows = LAYERS.map(([k, lbl], i) => {
    const n = L[k] || {title:'(unclassified)', meta:''};
    const w = layerCounts[k] || 0;
    const nodeEntries = nodeChain[k] || [];
    const bg = bgFromWeight(w);
    const bgStyle = bg ? `style="background:${bg}"` : '';
    const evidenceBadge = nodeEntries.length
      ? `<span class="lc-evidence-badge" title="Premises: ${nodeEntries.map(e => e.sourceId).join(', ')}">${nodeEntries.length}·${w.toFixed(1)}</span>`
      : `<span class="lc-evidence-badge empty" title="No premises inform this layer">—</span>`;

    // Edge to next layer
    let arrow = '';
    if (i < LAYERS.length - 1) {
      const nextK = LAYERS[i + 1][0];
      const edgeKey = `${k}->${nextK}`;
      const ew = edgeCounts[edgeKey] || 0;
      const eEntries = edgeChain[edgeKey] || [];
      const eColor = ew > 0 ? 'var(--good)' : 'var(--ink-3)';
      const eStroke = ew > 0 ? 2 : 1;
      const eLabel = eEntries.length
        ? `<span class="lc-edge-label" title="Premises: ${eEntries.map(e => e.sourceId).join(', ')}">${eEntries.length}·${ew.toFixed(1)}</span>`
        : '';
      arrow = `<div class="lc-arrow">
        <svg width="14" height="12" viewBox="0 0 14 12">
          <path d="M 7 0 L 7 9 M 3 5 L 7 9 L 11 5" fill="none" stroke="${eColor}" stroke-width="${eStroke}"/>
        </svg>
        ${eLabel}
      </div>`;
    }

    return `<div class="lc-row ${k}">
      <div class="lc-tag">${esc(lbl)}</div>
      <div class="lc-box" ${bgStyle}>
        <div class="lc-title">${esc(n.title)} ${evidenceBadge}</div>
        <div class="lc-meta">${esc(n.meta || '')}</div>
      </div>
    </div>${arrow}`;
  }).join('');
  const th = L.therapy || {title:'(therapy not curated)', meta:''};
  return `<div class="lc-container">
    <div class="lc-stack">${rows}</div>
    <svg class="lc-loopback" viewBox="0 0 170 600" preserveAspectRatio="none">
      <defs>
        <marker id="lcArrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--good)"/>
        </marker>
      </defs>
      <path d="M 4 590 C 160 590, 160 10, 4 10" fill="none" stroke="var(--good)"
            stroke-width="2" stroke-dasharray="4 3" marker-end="url(#lcArrow2)"/>
    </svg>
    <div class="lc-therapy-label">
      <div class="lc-therapy-lbl-h">Therapy · closes the loop</div>
      <div class="lc-therapy-lbl-title">${esc(th.title)}</div>
      <div class="lc-therapy-lbl-sub">${esc(th.meta || '')}</div>
    </div>
  </div>`;
}

function renderChainArtifact(p, hypId, artifactIdx) {
  if (!hypId || !MECH_DATA) return '';
  const byId = Object.fromEntries(MECH_DATA.hypotheses.map(h => [h.id, h]));
  const hyp = byId[hypId];
  if (!hyp) return '';

  // Only apply currentEdgeId selection to the currently-focused chain
  // (the last chain artifact for hypId that matches currentHypId).
  const edgeSel = (hypId === currentHypId) ? currentEdgeId : null;

  // Layered biological-organization chain is the sole view now — the
  // Cause → Effect flow diagram was retired. Pass the stored hypothesis
  // so the layered view can colour each layer by evidence weight.
  const storedHyp = (p.hypothesisRanking || []).find(r => r.id === hypId);
  const chainHtml = renderLayeredChain(hypId, storedHyp);

  const ranking = p.hypothesisRanking || [];
  const r = ranking.find(x => x.id === hypId);
  const pe = (r && r.patientEvidence) || [];
  const peHtml = pe.length ? `
    <div class="chain-pe">
      <div class="chain-pe-h">PATIENT · evidence from this patient's labs (${pe.length} bullets)</div>
      <ul>${pe.map(e => `<li><span class="tick">✓</span>${esc(e.text)}</li>`).join('')}</ul>
    </div>` : '';
  const lede = hyp.detail?.lede
    ? `<div class="chain-lede">${esc(hyp.detail.lede)}</div>` : '';

  // World-model provenance + trace layer — reuses `storedHyp` from above
  // (declared before renderLayeredChain call, contains scoreVector + chainLinks
  // + generator info + premises + therapeutics).
  const provenance = storedHyp?.generator
    ? `<div class="gen-provenance">
        <span class="gen-provenance-badge">GENERATED</span>
        <span>by <b>${esc(storedHyp.generator.id)}</b>
          <span class="gen-provenance-sep">·</span>
          ${esc(storedHyp.generator.version)}
          <span class="gen-provenance-sep">·</span>
          ${esc(storedHyp.generator.at ? storedHyp.generator.at.slice(0, 10) : '')}
        </span>
        <button class="gen-regenerate" data-regenerate="${esc(hypId)}"
                title="Stub — would re-invoke the hypothesis world model">
          ↻ regenerate
        </button>
      </div>` : '';

  const premises = (storedHyp?.premises || []).slice(0, 8);
  const premisesDrawer = premises.length ? `
    <div class="premises-drawer">
      <div class="premises-drawer-h">
        Premises consulted <b>·</b> ${premises.length} of ${storedHyp.premises.length} shown
      </div>
      ${premises.map(pr => {
        const w = pr.weight;
        const cls = w >= 0 ? 'pos' : 'neg';
        const sign = w >= 0 ? '+' : '';
        return `<div class="premise-row">
          <span class="premise-source">${esc(pr.sourceId)}</span>
          <span class="premise-weight ${cls}">${sign}${w.toFixed(2)}</span>
          <span class="premise-rationale">${esc(pr.rationale || '(no rationale)')}</span>
        </div>`;
      }).join('')}
    </div>` : '';

  const therapies = storedHyp?.therapeutics || [];
  const therapiesPanel = therapies.length ? `
    <div class="therapies-panel">
      <div class="therapies-panel-h">
        Candidate therapeutics <b>·</b> generated for this hypothesis
      </div>
      ${therapies.map(t => `
        <div class="therapy-card">
          <div class="therapy-card-head">
            <span class="therapy-modality ${esc(t.modality)}">${esc(t.modality)}</span>
            <span class="therapy-design">${esc(JSON.stringify(t.design))}</span>
            <span class="therapy-eligibility ${esc(t.eligibilityStatus || 'unknown')}">
              ${esc((t.eligibilityStatus || 'unknown').replace(/_/g, ' '))}
            </span>
          </div>
          <div class="therapy-rationale">${esc(t.rationale)}</div>
        </div>
      `).join('')}
    </div>` : '';

  // Score vector strip — the multi-dimensional ranking
  const sv = storedHyp?.scoreVector;
  const contras = sv?.contradictions || [];
  const consistencyClass = contras.length === 0 ? '' : (contras.length >= 3 ? 'bad' : 'warn');
  const consistencyTitle = contras.length === 0
    ? 'No chain position has both positive AND negative premise weight ≥ 0.1'
    : `${contras.length} chain position${contras.length === 1 ? '' : 's'} show conflicting evidence`;
  const scoreVectorStrip = sv ? `
    <div class="score-vector">
      <div class="sv-metric">
        <span class="sv-metric-label">Aggregate</span>
        <span class="sv-metric-value">${sv.aggregate.toFixed(1)}</span>
        <div class="sv-metric-bar"><div class="sv-metric-fill" style="width:${Math.min(100, sv.aggregate * 10)}%"></div></div>
      </div>
      <div class="sv-metric" title="Fraction of biological layers with any supporting evidence — chains with gaps score lower">
        <span class="sv-metric-label">Coverage</span>
        <span class="sv-metric-value">${(sv.coverage * 100).toFixed(0)}%</span>
        <div class="sv-metric-bar"><div class="sv-metric-fill" style="width:${sv.coverage * 100}%"></div></div>
      </div>
      <div class="sv-metric" title="${esc(consistencyTitle)}">
        <span class="sv-metric-label">Consistency</span>
        <span class="sv-metric-value">${(sv.consistency * 100).toFixed(0)}%</span>
        <div class="sv-metric-bar"><div class="sv-metric-fill ${consistencyClass}" style="width:${sv.consistency * 100}%"></div></div>
      </div>
      <div class="sv-metric" title="1 / (1 + empty layers) — chains with fewer gaps score higher">
        <span class="sv-metric-label">Parsimony</span>
        <span class="sv-metric-value">${(sv.parsimony * 100).toFixed(0)}%</span>
        <div class="sv-metric-bar"><div class="sv-metric-fill" style="width:${sv.parsimony * 100}%"></div></div>
      </div>
      <span class="sv-hint">${sv.chainLinks} chain links · ranking is vector, not scalar</span>
    </div>` : '';

  // Refined-claim panel: prefer LLM narrative (layer2), fall back to
  // deterministic enrichment (layer1). Falls back silently to nothing
  // if neither is available.
  const rc = storedHyp?.refinedClaim || {};
  const layer1 = rc.layer1 || {};
  const layer2 = rc.layer2 || null;
  const primaryNarrative = layer2?.narrative || layer1.claim || '';
  const cbd = layer2?.considered_but_discarded || [];
  const testable = layer2?.testable_predictions || [];
  const modelTag = layer2?.model || (layer2 ? 'llm' : 'deterministic');
  const layerBadge = layer2 ? 'LAYER 2' : (layer1.claim ? 'LAYER 1' : '');
  const refinedClaimPanel = primaryNarrative ? `
    <div class="refined-claim">
      <div class="refined-claim-h">
        <span class="layer-badge">${layerBadge}</span>
        Claim
        <span class="model-tag">${esc(modelTag)}</span>
      </div>
      <div class="refined-narrative">${esc(primaryNarrative)}</div>
      ${(cbd.length || testable.length) ? `
      <div class="refined-details">
        ${cbd.length ? `
        <details class="refined-section" open>
          <summary>Considered but discarded (${cbd.length})</summary>
          <div class="refined-section-body">
            ${cbd.map(c => `
              <div class="cbd-item">
                <span class="other-id">H${esc(c.other_id || '?')}</span>${esc(c.why_lower || '')}
              </div>
            `).join('')}
          </div>
        </details>` : ''}
        ${testable.length ? `
        <details class="refined-section">
          <summary>Testable predictions (${testable.length})</summary>
          <div class="refined-section-body">
            <ul>${testable.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          </div>
        </details>` : ''}
      </div>` : ''}
    </div>` : '';

  // Contradictions panel — surfaces the specific chain positions where
  // premises argue in opposite directions (e.g., cohort literature says
  // distal cells express Dp71, but patient's isoform-arch says they're spared)
  const contradictionsPanel = contras.length > 0 ? `
    <div class="contradictions-panel">
      <div class="contradictions-panel-h">
        ⚠ Contradicting evidence
        <b>${contras.length} chain position${contras.length === 1 ? '' : 's'}</b>
      </div>
      ${contras.map(c => `
        <div class="contra-card">
          <div class="contra-card-head">
            <span class="contra-position">${esc(c.position)}</span>
            <span class="contra-signs">
              <span class="pos">+${c.positiveSum.toFixed(2)}</span>
              vs
              <span class="neg">−${c.negativeSum.toFixed(2)}</span>
            </span>
          </div>
          ${(c.supporting || []).map(p => `
            <div class="contra-row pos">
              <span class="marker">+${p.weight.toFixed(2)}</span>
              <span class="rationale">${esc(p.rationale || p.premiseId)}</span>
            </div>`).join('')}
          ${(c.opposing || []).map(p => `
            <div class="contra-row neg">
              <span class="marker">${p.weight.toFixed(2)}</span>
              <span class="rationale">${esc(p.rationale || p.premiseId)}</span>
            </div>`).join('')}
        </div>
      `).join('')}
    </div>` : '';

  return `<div class="gen-artifact" data-artifact-idx="${artifactIdx}">
    <div class="gen-artifact-h">
      <span class="gen-artifact-badge">CHAIN</span>
      Reasoning chain · H${esc(hypId)}: ${esc(hyp.name)}
      <button class="close" data-artifact-remove="${artifactIdx}">×</button>
    </div>
    ${provenance}
    ${scoreVectorStrip}
    ${refinedClaimPanel}
    ${contradictionsPanel}
    ${peHtml}
    ${lede}
    <div style="overflow-x:auto">${chainHtml}</div>
    ${premisesDrawer}
    ${therapiesPanel}
  </div>`;
}

function renderChatArtifact(a, idx) {

    <div class="chat-turn-role">${a.role === 'user' ? 'You' : 'Agent'}</div>
    <div class="chat-turn-body">

}

// ESM3 fold metadata — which patients have a baked structure, and where
// their variant residue lands in the chunk. Add entries as new folds
// are baked (e.g., Dp140 for exon-45 patients).
//
// Chunk offsets: for Dp71 we folded aa 3059-3685 of DMD (627 aa) with
// cache_key "P11532_Dp71". A DMD aa position N maps to chunk residue
// (N - 3059 + 1).
const DP71_CHUNK_START = 3059;
const ESM3_FOLDS = {
  // Key: `${cohort}#${cohortPatientId}` matches patient identity.
  //   wt        — WT structure (variant residue highlighted red)
  //   truncated — predicted truncated protein IF the transcript escapes NMD
  //               (produced via a separate Forge fold of the WT sequence
  //                truncated at the PTC codon)
  'S2_reported#258': {
    isoform: 'Dp71', length: 627, meanPlddt: 0.69,
    variantResi: 3083 - DP71_CHUNK_START + 1,   // = 25
    variantLabel: 'Trp3083*',
    consequence: 'Nonsense', ptcNote: 'PTC in central chunk — NMD-triggering (no protein)',
    wt:        { pdb: 'esm3_pdbs/P11532_Dp71.pdb' },
    truncated: null,  // 24-aa truncation too small to fold usefully
  },
  'S1_novel#5': {
    isoform: 'Dp71', length: 627, meanPlddt: 0.69,
    variantResi: 3552 - DP71_CHUNK_START + 1,   // = 494
    variantLabel: 'Ser3552Lysfs*6',
    consequence: 'Frameshift',
    ptcNote: 'PTC near last exon-exon junction — NMD-escape candidate',
    wt:        { pdb: 'esm3_pdbs/P11532_Dp71.pdb' },
    truncated: { pdb: 'esm3_pdbs/P11532_Dp71_truncP5.pdb', length: 493, meanPlddt: 0.72 },
  },
};

// Initialize a 3Dmol.js viewer inside `divId`. `mode` is 'wt' or 'truncated'.
//   wt        — colour by pLDDT + highlight variant residue red + label
//   truncated — colour by pLDDT + last residue red (the truncation cut)
function initEsm3Viewer(divId, pdbPath, resi, variantLabel, mode) {
  if (typeof $3Dmol === 'undefined') {
    document.getElementById(divId).innerHTML =
      '<div class="esm3-unavailable">3Dmol.js failed to load from CDN.</div>';
    return;
  }
  const el = document.getElementById(divId);
  if (!el) return;
  el.innerHTML = '';
  const viewer = $3Dmol.createViewer(el, { backgroundColor: '#1a2233' });
  fetch(pdbPath).then(r => r.text()).then(pdb => {
    viewer.addModel(pdb, 'pdb');
    viewer.setStyle({}, { cartoon: {
      colorscheme: { prop: 'b', gradient: 'rwb', min: 0.5, max: 0.95 }
    }});
    if (mode === 'truncated') {
      // The last residue of the model IS the last aa before the PTC —
      // mark it red to signal the truncation point.
      const atoms = viewer.getModel().selectedAtoms({ atom: 'CA' });
      const lastResi = atoms.length ? atoms[atoms.length - 1].resi : null;
      if (lastResi != null) {
        viewer.setStyle({ resi: lastResi }, {
          cartoon: { color: '#c94a4a' },
          stick:   { color: '#c94a4a', radius: 0.4 },
        });
        viewer.addSurface($3Dmol.SurfaceType.VDW,
          { opacity: 0.4, color: '#c94a4a' }, { resi: lastResi });
        viewer.addLabel('Truncation · ' + variantLabel, {
          position: { resi: lastResi, atom: 'CA' },
          backgroundColor: '#c94a4a', backgroundOpacity: 0.85,
          fontColor: 'white', fontSize: 11, borderThickness: 0,
          showBackground: true, inFront: true,
        });
      }
    } else {
      viewer.setStyle({ resi: resi }, {
        cartoon: { color: '#c94a4a' },
        stick:   { color: '#c94a4a', radius: 0.3 },
      });
      viewer.addSurface($3Dmol.SurfaceType.VDW,
        { opacity: 0.35, color: '#c94a4a' }, { resi: resi });
      viewer.addLabel(variantLabel, {
        position: { resi: resi, atom: 'CA' },
        backgroundColor: '#c94a4a', backgroundOpacity: 0.85,
        fontColor: 'white', fontSize: 12, borderThickness: 0,
        showBackground: true, inFront: true,
      });
    }
    viewer.zoomTo();
    viewer.render();
  });
}

// Render the ESM3 3D structure artifact — WT and (if baked) the
// predicted truncated protein product side-by-side.
function renderEsm3Structure(p, idx) {
  const key = `${p.cohort}#${p.cohortPatientId}`;
  const fold = ESM3_FOLDS[key];

  if (!fold) {
    return `<div class="gen-artifact" data-artifact-idx="${idx}">
      <div class="gen-artifact-h">
        <span class="gen-artifact-badge">ESM3</span>
        3D structure · ${esc(patientLabel(p))}
        <button class="close" data-artifact-remove="${idx}">×</button>
      </div>
      <div class="esm3-unavailable">
        No ESM3 fold baked for ${esc(patientLabel(p))} yet.<br>
        Currently baked: Patient 3 (Trp3083*, WT only — truncated 24 aa too small to fold)
        and Patient 5 (Ser3552Lysfs*6, WT + truncated), both on Dp71.<br>
        <span style="font-style:italic">Additional isoforms and truncations will be folded on a bigger box.</span>
      </div>
    </div>`;
  }

  const wtDivId = `esm3-viewer-${idx}-wt`;
  const trDivId = `esm3-viewer-${idx}-tr`;
  const hasTr = !!fold.truncated;

  const lede = `${fold.isoform} isoform (aa ${DP71_CHUNK_START}–${DP71_CHUNK_START + fold.length - 1} of full-length DMD, ${fold.length} aa). ` +
               `${esc(patientLabel(p))}'s variant lands at Dp71 residue <b>${fold.variantResi}</b>. ` +
               `${esc(fold.ptcNote)}.` +
               (hasTr
                 ? ` The <b>truncated protein</b> (${fold.truncated.length} aa) shown on the right is the predicted product IF the mutant transcript escapes NMD.`
                 : ` No truncated structure baked (${fold.variantResi} aa is too short to fold usefully).`);

  const wtPanel = `
    <div class="esm3-panel">
      <div class="esm3-panel-h">Wild-type <span class="esm3-panel-h-sub">variant residue marked red</span></div>
      <div class="esm3-viewer" id="${wtDivId}"></div>
      <div class="esm3-panel-meta">
        <b>${fold.length}</b> aa · pLDDT <b>${(fold.meanPlddt * 100).toFixed(0)}</b>/100
      </div>
    </div>`;

  const trPanel = hasTr ? `
    <div class="esm3-panel">
      <div class="esm3-panel-h">Predicted truncated
        <span class="esm3-panel-h-sub">if NMD is escaped · red = cut point</span></div>
      <div class="esm3-viewer" id="${trDivId}"></div>
      <div class="esm3-panel-meta">
        <b>${fold.truncated.length}</b> aa · pLDDT <b>${(fold.truncated.meanPlddt * 100).toFixed(0)}</b>/100
      </div>
    </div>` : `
    <div class="esm3-panel">
      <div class="esm3-panel-h">Predicted truncated <span class="esm3-panel-h-sub">not baked</span></div>
      <div class="esm3-unavailable">
        Truncation at aa ${fold.variantResi} produces only ${fold.variantResi - 1} aa of protein —
        below the useful ESM3 fold threshold. Skipped for this patient.
      </div>
    </div>`;

  return `<div class="gen-artifact" data-artifact-idx="${idx}">
    <div class="gen-artifact-h">
      <span class="gen-artifact-badge">ESM3</span>
      3D structure · ${esc(fold.isoform)} · ${esc(fold.variantLabel)} · WT + truncated
      <button class="close" data-artifact-remove="${idx}">×</button>
    </div>
    <div class="esm3-wrap">
      <div class="esm3-lede">${lede}</div>
      <div class="esm3-meta">
        <span><b>Isoform</b> ${esc(fold.isoform)}</span>
        <span><b>Variant residue</b> ${fold.variantResi} (full-DMD ${esc(fold.variantLabel)})</span>
        <span><b>Consequence</b> ${esc(fold.consequence)}</span>
      </div>
      <div class="esm3-grid">
        ${wtPanel}
        ${trPanel}
      </div>
      <div class="esm3-legend">
        <span><span class="esm3-legend-sw" style="background:#3860a0"></span>High pLDDT (confident fold)</span>
        <span><span class="esm3-legend-sw" style="background:#e8e8e8"></span>Medium pLDDT</span>
        <span><span class="esm3-legend-sw" style="background:#c94a4a"></span>Low pLDDT · variant or cut residue</span>
      </div>
      <div class="esm3-hint">
        Drag to rotate · scroll to zoom · shift-drag to pan. Structure by ESM3 Forge (esm3-open-2024-03).
      </div>
    </div>
  </div>`;
}

// After render, initialize any 3Dmol viewers that just entered the DOM.
// Two viewers per artifact when both WT and truncated folds are baked.
function initPendingEsm3Viewers() {
  rightStream.forEach((a, i) => {
    if (a.type !== 'esm3_structure') return;
    const p = DATA.patients.find(x => x.id === currentPatientId);
    if (!p) return;
    const key = `${p.cohort}#${p.cohortPatientId}`;
    const fold = ESM3_FOLDS[key];
    if (!fold) return;

    // WT viewer
    const wtDivId = `esm3-viewer-${i}-wt`;
    const wtEl = document.getElementById(wtDivId);
    if (wtEl && !wtEl.querySelector('canvas') && fold.wt) {
      initEsm3Viewer(wtDivId, fold.wt.pdb, fold.variantResi, fold.variantLabel, 'wt');
    }

    // Truncated viewer (only if baked)
    if (fold.truncated) {
      const trDivId = `esm3-viewer-${i}-tr`;
      const trEl = document.getElementById(trDivId);
      if (trEl && !trEl.querySelector('canvas')) {
        initEsm3Viewer(trDivId, fold.truncated.pdb, null, fold.variantLabel, 'truncated');
      }
    }
  });
}

// Marimekko: NMD category × ACMG classification cross-tab from ClinVar.
// Column widths proportional to ACMG totals; segment heights proportional
// to NMD counts within each column.
function renderNmdMarimekko(idx) {
  const c = MECH_DATA?.nmdCohort;
  if (!c) return `<div class="gen-artifact"><div class="gen-artifact-h">
    <span class="gen-artifact-badge">NMD × ACMG</span> NMD cross-tab</div>
    <div style="color:var(--bad);font-size:11px">
      nmdCohort not baked — run hydrate_mechanism_view.py</div></div>`;

  const W = 640, H = 360, pad = { l: 60, r: 20, t: 20, b: 60 };
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;

  const ACMG_LABEL = { benign: 'Benign', uncertain: 'Uncertain', pathogenic: 'Pathogenic' };
  const NMD_LABEL  = { triggering: 'NMD triggering',
                       transcript_dependent: 'Transcript dependent',
                       escape: 'NMD escaping' };
  const NMD_COLOR  = { triggering: 'var(--bad)',
                       transcript_dependent: 'var(--sky)',
                       escape: 'var(--warn)' };

  // Column widths in pixels (proportional to ACMG totals).
  const total = c.total;
  const colX = {}; let x = pad.l;
  c.acmgOrder.forEach(a => {
    const w = (c.acmgTotals[a] / total) * plotW;
    colX[a] = { x, w };
    x += w;
  });

  // Build rects: for each ACMG column, stack NMD segments top-to-bottom
  // sized by their share of the column.
  const rects = [];
  const labels = [];
  c.acmgOrder.forEach(a => {
    const col = colX[a];
    const colTotal = c.acmgTotals[a];
    let y = pad.t;
    c.nmdOrder.forEach(n => {
      const cnt = c.grid[a][n];
      const h = colTotal > 0 ? (cnt / colTotal) * plotH : 0;
      if (h > 0) {
        rects.push(`<rect x="${col.x}" y="${y}" width="${col.w}" height="${h}"
                       fill="${NMD_COLOR[n]}" opacity="0.85"
                       stroke="white" stroke-width="1.5"/>`);
        // Label if segment is big enough (>28px tall AND >70px wide)
        if (h > 28 && col.w > 70) {
          const pct = (cnt / colTotal * 100).toFixed(1);
          labels.push(`<text x="${col.x + col.w/2}" y="${y + h/2 - 3}"
                        text-anchor="middle" fill="white" font-size="11"
                        font-weight="700">${cnt.toLocaleString('en-US')}</text>
                      <text x="${col.x + col.w/2}" y="${y + h/2 + 11}"
                        text-anchor="middle" fill="white" font-size="10"
                        opacity="0.9">(${pct}%)</text>`);
        }
      }
      y += h;
    });
  });

  // X-axis: ACMG labels + totals below each column
  const xAxis = c.acmgOrder.map(a => {
    const col = colX[a];
    return `<text x="${col.x + col.w/2}" y="${H - pad.b + 18}"
              text-anchor="middle" fill="var(--ink)" font-size="12"
              font-weight="700">${ACMG_LABEL[a]}</text>
            <text x="${col.x + col.w/2}" y="${H - pad.b + 34}"
              text-anchor="middle" fill="var(--ink-3)" font-size="11"
              font-variant-numeric="tabular-nums">
              n=${c.acmgTotals[a].toLocaleString('en-US')} · ${(c.acmgTotals[a]/total*100).toFixed(0)}%
            </text>`;
  }).join('');

  // Y-axis label
  const yAxis = `<text x="${pad.l - 10}" y="${pad.t + plotH/2}"
    text-anchor="end" fill="var(--ink-2)" font-size="11"
    transform="rotate(-90 ${pad.l - 10} ${pad.t + plotH/2})">
    within-column proportion</text>`;

  const legendHtml = c.nmdOrder.map(n =>
    `<span><span class="mek-legend-sw" style="background:${NMD_COLOR[n]}"></span>
     ${esc(NMD_LABEL[n])} <span style="color:var(--ink-3)">
     (${c.nmdTotals[n].toLocaleString('en-US')} · ${(c.nmdTotals[n]/total*100).toFixed(1)}%)</span></span>`
  ).join('');

  return `<div class="gen-artifact" data-artifact-idx="${idx}">
    <div class="gen-artifact-h">
      <span class="gen-artifact-badge">NMD × ACMG</span>
      Marimekko · ${esc(c.source)}
      <button class="close" data-artifact-remove="${idx}">×</button>
    </div>
    <div class="mek-wrap">
      <div class="mek-lede">
        <b>${total.toLocaleString('en-US')} ClinVar DMD variants</b> stratified by ACMG classification (column widths)
        and NMD category (segment heights within each column). Column width shows how the
        variant landscape breaks down by pathogenicity; segment height shows what fraction
        of each pathogenicity class is predicted NMD-triggering.
      </div>
      <svg class="mek-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${rects.join('')}
        ${labels.join('')}
        ${xAxis}
        ${yAxis}
      </svg>
      <div class="mek-legend">${legendHtml}</div>
      <div class="mek-notes">${esc(c.rules.notes)}</div>
    </div>
  </div>`;
}

// Render one widget-based artifact (uses window.WIDGETS from
// widget_palette.js). `a.widget` is the widget key; `a.props` overrides
// the widget's example.
function renderWidgetArtifact(a, idx) {
  if (!window.WIDGETS || !window.WIDGETS[a.widget]) {
    return `<div class="gen-artifact"><div class="gen-artifact-h">
      <span class="gen-artifact-badge">WIDGET</span>${esc(a.widget)}
      </div><div style="color:var(--bad);font-size:11px">
      Widget "${esc(a.widget)}" not found in palette.</div></div>`;
  }
  const props = a.props || window.WIDGETS[a.widget].example;
  return `<div class="gen-artifact" data-artifact-idx="${idx}">
    <div class="gen-artifact-h">
      <span class="gen-artifact-badge">${esc(a.widget.toUpperCase())}</span>
      ${esc(a.title || a.widget)}
      <button class="close" data-artifact-remove="${idx}">×</button>
    </div>
    ${a.note ? `<div class="chain-lede">${esc(a.note)}</div>` : ''}
    <div style="overflow-x:auto">${window.WIDGETS[a.widget].render(props)}</div>
  </div>`;
}

// Render the right-panel artifact stream — each artifact is rendered
// in order; the stream grows as user clicks / asks; body scrolls.
function renderStream(p) {
  return rightStream.map((a, i) => {
    switch (a.type) {
      case 'hyp_rank':      return renderHypRankArtifact(p);
      case 'chain':         return renderChainArtifact(p, a.hypId, i);
      case 'chat':          return renderChatArtifact(a, i);
      case 'widget':        return renderWidgetArtifact(a, i);
      case 'nmd_marimekko':   return renderNmdMarimekko(i);
      case 'esm3_structure':  return renderEsm3Structure(p, i);
      default:              return '';
    }
  }).join('');
}

// Patient-scoped EXAMPLES catalog — organized by biological layer of
// organization (matches the Overview panel groups + the Dynamic Dashboard's
// question panel). Each item tagged with the artifact the answer produces.
function buildExamples(p) {
  // Build 4 unique isoform questions from this patient's actual impact
  // map (2 hit + 2 spared where possible). Deduplicates in case the
  // patient has all-hit or all-spared isoforms.
  const isoItems = [];
  const seenIso = new Set();
  const pushIso = (id, hit) => {
    const q = `Why is ${id} ${hit ? 'hit' : 'spared'}?`;
    if (!seenIso.has(q)) { seenIso.add(q); isoItems.push({tag:'chat', question:q}); }
  };
  const hitIsos    = p.isoformImpact.filter(i =>  i.hit);
  const sparedIsos = p.isoformImpact.filter(i => !i.hit);
  hitIsos.slice(0, 2).forEach(i => pushIso(i.id, true));
  sparedIsos.slice(0, 2).forEach(i => pushIso(i.id, false));
  // top up to 4 if under-full (e.g. all-hit or all-spared patient)
  for (const i of p.isoformImpact) {
    if (isoItems.length >= 4) break;
    pushIso(i.id, i.hit);
  }

  // Question panel structure follows the rare-disease-platform deck's
  // 4-pillar mechanism-mapping framework (Q2 2026 deck, pages 4/8/11/20/28)
  // adapted from ALMS1 to DMD. Tags encode artifact availability:
  //   ✓ = rich artifact wired
  //   ○ = plain chat only (no widget yet)
  //   ◇ = not yet integrated (roadmap)
  return [
    { category: '★ Ultimate question', items: [
      { tag: '✓ chain', question: 'How does this patient\'s variant explain their clinical phenotype?' },
    ]},

    // ---- Pillar 1: Literature ------------------------------------
    { category: 'P1 · Literature', items: [
      { tag: '✓ chat',       question: 'What is this patient\'s variant and where was it first published?' },
      { tag: '✓ chat',       question: 'What has the literature reported about this variant class?' },
      { tag: '✓ widget',     question: 'Where do DMD variants cluster on the protein?' },
      { tag: '✓ widget',     question: 'What variant classes drive DMD in the cohort?' },
    ]},

    // ---- Pillar 2: Transcript ------------------------------------
    { category: 'P2 · Transcript', items: [
      { tag: '✓ chain',      question: 'Does this variant trigger NMD?' },
      { tag: '✓ marimekko',  question: 'How do NMD categories break down across ACMG classes?' },
      { tag: '✓ chain',      question: 'Does this variant cause aberrant splicing (AbSplice)?' },
      { tag: '○ chat',       question: 'Is there altered expression at the transcript level?' },
      { tag: '◇ roadmap',    question: 'Is there allele-specific expression evidence?' },
      { tag: '✓ chain',      question: 'Which DMD isoform is affected?' },
      { tag: '✓ widget',     question: 'Show me the exon architecture of DMD' },
      { tag: '✓ widget',     question: 'How does isoform expression vary across cell types?' },
    ]},

    // Tie-in from Pillar 2 (deck pg 15): NMD ↔ symptom statistical relationships
    { category: 'P2 → Symptoms', items: [
      { tag: '◇ roadmap',    question: 'Are NMD-triggering variants associated with cardio symptoms in the cohort?' },
      { tag: '◇ roadmap',    question: 'Does NMD status predict syndromic severity, controlling for age?' },
    ]},

    // ---- Cell-type expression (deck pg 16-18) --------------------
    { category: 'Cell types', items: [
      { tag: '✓ widget',     question: 'Where is DMD most highly expressed at cell-type resolution?' },
      { tag: '✓ chain',      question: 'Which cell types are affected in this patient?' },
      { tag: '✓ chain',      question: 'Which tissues are spared?' },
      { tag: '○ chat',       question: 'Does the cell-type ranking match DMD symptoms (muscle, heart, brain, retina)?' },
    ]},

    // Patient-specific isoform questions (dynamically generated)
    { category: 'Isoform focus', items: isoItems.concat([
      { tag: '✓ ESM3',       question: 'Show the 3D structure with this patient\'s variant' },
    ]) },

    // ---- Pillar 3: Protein ---------------------------------------
    { category: 'P3 · Protein', items: [
      { tag: '✓ chain',      question: 'Is dystrophin protein abundance reduced in this patient?' },
      { tag: '✓ ESM3',       question: 'Does the variant cause misfolding of the truncated protein?' },
      { tag: '◇ roadmap',    question: 'Is there evidence for ER retention?' },
      { tag: '✓ chain',      question: 'Is degradation the primary loss mechanism?' },
      { tag: '⚠ partial',    question: 'What downstream molecular interactions are altered (Reactome)?' },
    ]},

    // Tie-in from Pillar 3 (deck pg 26): LLR ↔ symptom statistical relationships
    { category: 'P3 → Symptoms', items: [
      { tag: '◇ roadmap',    question: 'Does ESM2 LLR severity predict individual symptoms?' },
      { tag: '◇ roadmap',    question: 'Does LLR severity predict syndromic score, controlling for age?' },
      { tag: '◇ roadmap',    question: 'Can UK Biobank proteomics confirm reduced dystrophin abundance?' },
    ]},

    // ---- Pillar 4: Downstream ------------------------------------
    { category: 'P4 · Downstream', items: [
      { tag: '◇ roadmap',    question: 'What are DMD\'s molecular interactors and pathways (Open Targets)?' },
      { tag: '◇ roadmap',    question: 'What genes co-express with DMD (ARCHS4)?' },
      { tag: '◇ roadmap',    question: 'Which protein complexes and direct interactors are disrupted (STRING)?' },
      { tag: '◇ roadmap',    question: 'What is the cellular perturbation response to DMD loss (Geneformer)?' },
      { tag: '◇ roadmap',    question: 'Which drugs might reverse the DMD-loss signature (CMap)?' },
    ]},

    // ---- Mechanism synthesis (workbench-unique) ------------------
    { category: '✦ Mechanism synthesis', items: [
      { tag: '✓ chain',      question: 'Show me the reasoning chain' },
      { tag: '✓ chain',      question: 'What supports H01 (sarcolemmal fragility)?' },
      { tag: '✓ chain',      question: 'What supports H02 (partial in-frame rescue)?' },
      { tag: '✓ chain',      question: 'What supports H03 (NMD-mediated loss)?' },
      { tag: '✓ chain',      question: 'What supports H04 (distal isoform loss)?' },
      { tag: '✓ chat',       question: 'What was considered but discarded for the top hypothesis?' },
      { tag: '✓ chat',       question: 'What testable predictions follow from the top mechanism?' },
      { tag: '✓ chat',       question: 'Where do the premises contradict each other?' },
    ]},

    // ---- Patient clinical context --------------------------------
    { category: 'Patient labs', items: [
      { tag: '✓ chat',       question: 'What labs are abnormal for this patient?' },
      { tag: '✓ chat',       question: 'What is this patient\'s phenotype and prognosis?' },
      { tag: '✓ widget',     question: 'What is the cohort phenotype distribution?' },
    ]},

    // ---- Therapy (closes the loop) -------------------------------
    { category: 'Therapy', items: [
      { tag: '✓ chain',      question: 'What therapies apply given the mechanism?' },
      { tag: '✓ chain',      question: 'What AAV options exist for this patient?' },
    ]},
  ];
}

// Top of right panel: input + hero chips + expandable "more" panel.
function renderChatBar(p) {
  const suggestions = [
    'Why is this the top hypothesis?',
    'Show me the reasoning chain',
    'Which tissues are spared?',
    p.isoformImpact.find(i => !i.hit)
      ? `Why is ${p.isoformImpact.find(i => !i.hit).id} spared?`
      : `Why is ${p.isoformImpact[0].id} hit?`,
    'What therapies apply?',
  ];
  const chips = suggestions.map(s =>
    `<button class="pc-suggest" data-q="${esc(s)}">${esc(s)}</button>`).join('');

  const examples = buildExamples(p);
  const cats = examples.map(cat => `
    <div class="pc-cat">
      <h4>${esc(cat.category)}</h4>
      ${cat.items.map(item => `
        <button class="pc-cat-item" data-q="${esc(item.question)}">
          <span class="pc-cat-item-tag">${esc(item.tag)}</span>
          <span class="pc-cat-item-q">${esc(item.question)}</span>
        </button>`).join('')}
    </div>`).join('');

  return `
    <div class="pc-chat-bar">
      <form class="pc-input-row" id="chat-form">
        <span class="pc-input-lbl">Ask</span>
        <input class="pc-input" id="chat-input" autocomplete="off"
               placeholder="Ask about ${esc(patientLabel(p))}…"
               ${chatStreaming ? 'disabled' : ''}/>
        <button class="pc-send" type="submit" ${chatStreaming ? 'disabled' : ''}>Send</button>
        <button type="button" class="pc-panel-btn" id="reset-stream"
                title="Clear artifact stream" style="font-size:14px;padding:5px 8px">↺</button>
      </form>
      <div class="pc-suggest-row">
        <span class="pc-suggest-lbl">Try:</span>
        ${chips}
        <button type="button" class="pc-more-toggle" id="more-toggle">
          ${morePanelOpen ? 'Hide example questions ▴' : 'See more example questions ▾'}
        </button>

      <div class="pc-more-panel" ${morePanelOpen ? '' : 'hidden'}>

          <button type="button" class="pc-more-close" id="more-close" aria-label="Close">×</button>
        </div>
        <div class="pc-cats">${cats}</div>

}
